<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --sidebar: #141414;
    --sidebar-hover: #242424;
    --sidebar-active: #e01f26;
    --ink: #171717;
    --ink-2: #52525b;
    --ink-3: #9ca3af;
    --line: #e6e7eb;
    --brand: #e01f26;
    --brand-2: #b8151b;
    --brand-soft: #fdeaea;
    --green: #16a34a;
    --green-soft: #dcfce7;
    --red: #dc2626;
    --red-soft: #fee2e2;
    --amber: #d97706;
    --amber-soft: #fef3c7;
    --purple: #7c3aed;
    --purple-soft: #f3e8ff;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
    --shadow-lg: 0 10px 40px rgba(15,23,42,.16);
    --radius: 14px;
    --radius-sm: 9px;
    --sidebar-w: 256px;
  }
  [data-theme="dark"] {
    --bg: #0d0d0f;
    --surface: #18181b;
    --surface-2: #131315;
    --sidebar: #000000;
    --sidebar-hover: #1c1c1f;
    --ink: #f4f4f5;
    --ink-2: #a1a1aa;
    --ink-3: #71717a;
    --line: #27272a;
    --brand-soft: #2a1213;
    --green-soft: #10281c;
    --red-soft: #2c1618;
    --amber-soft: #2a2110;
    --purple-soft: #1f1633;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--brand); color: #fff; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--ink-3); border-radius: 20px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar);
    color: #cbd5e1;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 60;
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 22px 18px;
  }
  .brand-logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, #e01f26, #a10f14);
    display: grid; place-items: center;
    color: #fff; font-weight: 900; font-size: 17px; letter-spacing: -.5px;
    box-shadow: 0 6px 18px rgba(224,31,38,.45);
    overflow: hidden;
  }
  .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
  .placeholder-x {
  }
  .brand-name { color: #fff; font-weight: 700; font-size: 16px; letter-spacing: .2px; line-height: 1.1; }
  .brand-sub { color: #64748b; font-size: 11px; font-weight: 500; }
  .nav { flex: 1; overflow-y: auto; padding: 8px 12px 20px; }
  .nav::-webkit-scrollbar { width: 6px; }
  .nav::-webkit-scrollbar-thumb { background: #334155; border: none; }
  .nav-group-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px;
    color: #475569; font-weight: 700; padding: 16px 12px 7px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: #cbd5e1; font-weight: 500; font-size: 13.5px;
    transition: background .15s, color .15s; position: relative;
    width: 100%; text-align: left;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active { background: var(--sidebar-active); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.4); }
  .nav-item.active svg { opacity: 1; }
  .nav-badge {
    margin-left: auto; background: #334155; color: #cbd5e1;
    font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
  }
  .nav-item.active .nav-badge { background: rgba(255,255,255,.25); color: #fff; }
  .nav-parent .chev { margin-left: auto; width: 15px; height: 15px; opacity: .55; transition: transform .2s; }
  .nav-parent.open .chev { transform: rotate(90deg); opacity: .9; }
  .nav-parent.has-active { color: #fff; }
  .nav-sub { display: none; margin: 1px 0 5px; }
  .nav-sub.open { display: block; animation: navFade .18s ease; }
  @keyframes navFade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .nav-subitem { padding: 8px 12px 8px 42px; font-size: 13px; color: #9095a0; }
  .nav-subitem::before { content: ''; position: absolute; left: 25px; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: #3f3f46; transform: translateY(-50%); transition: background .15s; }
  .nav-subitem:hover::before { background: #71717a; }
  .nav-subitem.active { background: var(--sidebar-active); color: #fff; }
  .nav-subitem.active::before { background: #fff; }
  .sidebar-foot { padding: 14px; border-top: 1px solid rgba(255,255,255,.06); }
  .user-chip {
    display: flex; align-items: center; gap: 11px; padding: 8px; border-radius: 10px;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg,#f59e0b,#ef4444);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
  }
  .user-name { color: #fff; font-weight: 600; font-size: 13px; }
  .user-role { color: #64748b; font-size: 11px; }

  /* ---------- Main ---------- */
  .main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 64px; background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px; position: sticky; top: 0; z-index: 40;
  }
  .hamburger { display: none; }
  .page-title { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  .search {
    margin-left: auto; display: flex; align-items: center; gap: 9px;
    background: var(--surface-2); border: 1px solid var(--line);
    padding: 9px 14px; border-radius: 10px; width: 320px; max-width: 40vw;
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .search svg { width: 16px; height: 16px; color: var(--ink-3); }
  .search input { border: none; background: none; outline: none; width: 100%; }
  .global-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); max-height: 440px; overflow-y: auto; display: none; z-index: 60; }
  .global-results.open { display: block; }
  .gr-sec { padding: 9px 14px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-3); font-weight: 700; }
  .gr-item { padding: 9px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; border-top: 1px solid var(--line); }
  .gr-item:hover { background: var(--surface-2); }
  .sres { padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .sres:hover, .sres.hl { background: var(--surface-2); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    color: var(--ink-2); transition: background .15s;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 19px; height: 19px; }
  .save-status { font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: color .2s; }
  .save-status.saving { color: var(--ink-3); }
  .save-status.saved { color: var(--green); }
  .save-status.error { color: var(--red); cursor: default; }

  .content { padding: 28px; max-width: 1400px; width: 100%; margin: 0 auto; }

  /* ---------- Common ---------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .page-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
  .page-head p { color: var(--ink-2); margin-top: 3px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
    transition: transform .08s, background .15s, box-shadow .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.3); }
  .btn-primary:hover { background: var(--brand-2); }
  .btn-ghost { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn-danger { background: var(--red-soft); color: var(--red); }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* KPI grid */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 18px; margin-bottom: 26px; }
  .kpi { padding: 22px; position: relative; overflow: hidden; }
  .kpi-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 16px; }
  .kpi-icon svg { width: 22px; height: 22px; }
  .kpi-label { color: var(--ink-2); font-size: 13px; font-weight: 500; }
  .kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -.8px; margin-top: 4px; }
  .kpi-trend { font-size: 12px; font-weight: 600; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; }
  .up { color: var(--green); } .down { color: var(--red); }

  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }
  .section-title { font-size: 15px; font-weight: 700; padding: 18px 20px; border-bottom: 1px solid var(--line); display:flex; align-items:center; justify-content: space-between; }

  /* Table */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar .search { margin-left: 0; width: 300px; }
  .filter-select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; font-weight: 500; cursor: pointer; outline: none;
  }
  .filter-select:focus { border-color: var(--brand); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--ink-3); font-weight: 700; padding: 13px 16px; border-bottom: 1px solid var(--line);
    background: var(--surface-2); white-space: nowrap; position: sticky; top: 0;
  }
  tbody td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  .cell-strong { font-weight: 600; }
  .cell-mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; color: var(--ink-2); }
  .badge { display: inline-flex; align-items:center; gap:5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700; }
  .badge-green { background: var(--green-soft); color: var(--green); }
  .badge-red { background: var(--red-soft); color: var(--red); }
  .badge-amber { background: var(--amber-soft); color: var(--amber); }
  .badge-blue { background: var(--brand-soft); color: var(--brand); }
  .badge-gray { background: var(--surface-2); color: var(--ink-2); }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .row-actions .icon-btn { width: 32px; height: 32px; border-radius: 8px; }
  .row-actions .icon-btn svg { width: 15px; height: 15px; }
  .row-actions .icon-btn:hover { color: var(--brand); background: var(--brand-soft); }
  .row-actions .del:hover { color: var(--red); background: var(--red-soft); }

  .empty { text-align: center; padding: 60px 20px; color: var(--ink-3); }
  .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .5; }
  .empty h3 { color: var(--ink-2); font-size: 15px; margin-bottom: 4px; }

  /* Product image thumb */
  .thumb {
    width: 38px; height: 38px; border-radius: 9px; background: var(--surface-2);
    display: grid; place-items: center; color: var(--ink-3); font-weight: 700; font-size: 13px;
    border: 1px solid var(--line); flex-shrink: 0;
  }
  .prod-cell { display: flex; align-items: center; gap: 11px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(3px);
    display: none; align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 20px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
    width: 100%; max-width: 680px; animation: pop .2s ease; margin: auto;
  }
  @keyframes pop { from { transform: scale(.96) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { font-size: 18px; font-weight: 700; }
  .modal-body { padding: 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .field label .req { color: var(--red); }
  .field input, .field select, .field textarea {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 24px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 18px 18px; }

  /* Toast */
  .toast-wrap { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
  .toast {
    background: var(--sidebar); color: #fff; padding: 13px 18px; border-radius: 12px;
    box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 11px; font-weight: 500;
    animation: slideIn .25s ease; min-width: 260px;
  }
  .toast svg { width: 20px; height: 20px; flex-shrink: 0; }
  .toast.success svg { color: #4ade80; } .toast.error svg { color: #f87171; }
  @keyframes slideIn { from { transform: translateX(120%); } to { transform: none; } }

  /* Ventas builder */
  .venta-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .line-add { display: flex; gap: 10px; margin-bottom: 4px; }
  .cart-summary { padding: 20px; position: sticky; top: 84px; }
  .summ-row { display: flex; justify-content: space-between; padding: 7px 0; color: var(--ink-2); }
  .summ-row.total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; font-size: 20px; font-weight: 800; color: var(--ink); }
  .qty-input { width: 62px; text-align: center; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

  .segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .segmented button { padding: 7px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
  .segmented button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .hidden { display: none !important; }

  /* Roles: el vendedor NO ve elementos marcados .solo-admin */
  .rol-vendedor:not(.ver-costo) .solo-admin { display: none !important; }

  /* Login */
  .login-screen { position: fixed; inset: 0; z-index: 300; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
  .login-screen.open { display: flex; }
  .login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 34px; width: 100%; max-width: 400px; text-align: center; }
  .login-users { display: flex; flex-direction: column; gap: 10px; }
  .login-user { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); transition: border-color .15s, background .15s; }
  .login-user:hover { border-color: var(--brand); background: var(--surface-2); }
  .pin-box { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  .pin-input { width: 180px; text-align: center; font-size: 24px; letter-spacing: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); outline: none; }
  .pin-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  @media (max-width: 1024px) {
    .grid-2 { grid-template-columns: 1fr; }
    .venta-layout { grid-template-columns: 1fr; }
    .cart-summary { position: static; }
  }
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
    .main { margin-left: 0; }
    .hamburger { display: grid; }
    .search { display: none; }
    .content { padding: 18px; }
    .form-grid { grid-template-columns: 1fr; }
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 55; display: none; }
    .scrim.open { display: block; }
  }
</style>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo">JL</div>
      <div>
        <div class="brand-name">JL REPUESTOS</div>
        <div class="brand-sub">Importaciones S.A.C.</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-chip" id="userChip"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn hamburger" id="hamburger" aria-label="Menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="page-title" id="pageTitle">Dashboard</div>
      <div id="searchWrap" style="margin-left:auto;position:relative">
        <div class="search" style="margin-left:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="globalSearch" placeholder="Buscar productos, clientes, cotizaciones...  ( / )" autocomplete="off" />
        </div>
        <div id="globalResults" class="global-results"></div>
      </div>
      <span id="saveStatus" class="save-status"></span>
      <button class="icon-btn" id="themeToggle" aria-label="Tema">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
      </button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="modal-overlay" id="modal"></div>
<div class="toast-wrap" id="toasts"></div>
<div id="loginScreen" class="login-screen"></div>

<script>
/* =====================================================================
   SGAE — Sistema de Gestión (moderno, single-file)
   Datos persistidos en localStorage. Sin dependencias externas.
   ===================================================================== */

/* ---------- Búsqueda normalizada (Fase 4) ----------
   norm() ignora guiones/espacios/mayúsculas → 'W712/75' y 'w71275' quedan iguales.
   Cada producto tiene un "blob" normalizado (código + reemplazo + nº de parte + desc + marca + línea),
   cacheado por id. La búsqueda parte la consulta en tokens y exige que TODOS estén en el blob
   (soporta "AMORTIG VOLVO", "últimos 6 dígitos" = subcadena, etc.). */
const _blob = new Map();
function norm(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function prodBlob(p){
  let b=_blob.get(p.id);
  if(b==null){ const pn=(p.partNumbers||[]).map(x=>x&&x.numero).join(' '); b=norm([p.codigo,p.codFab,p.desc,p.marca,p.linea,p.ubicacion,pn].join(' ')); _blob.set(p.id,b); }
  return b;
}
function invalidarBlob(id){ if(id) _blob.delete(id); else _blob.clear(); }
function buscarProductos(q, limit){
  const toks=String(q||'').split(/\s+/).map(norm).filter(Boolean);
  if(!toks.length) return [];
  const out=[];
  for(const p of DB.productos){ const b=prodBlob(p); if(toks.every(t=>b.includes(t))){ out.push(p); if(limit && out.length>=limit) break; } }
  return out;
}

/* Motor de guardado: IndexedDB (soporta cientos de MB → catálogo completo de 30k+) */
const IDB_NAME='sgae_db', IDB_STORE='kv';
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbGet(k){ return idbOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); })); }
function idbSet(k,v){ return idbOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,'readwrite'); t.objectStore(IDB_STORE).put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); })); }

async function load(){
  // 1) Lectura de la BD local. Si FALLA la lectura (no "vacía"), abortar SIN sembrar:
  //    sembrar aquí sobrescribiría datos reales (los 897 productos) con el seed demo.
  let d;
  try { d = await idbGet('db'); }
  catch(e){ throw new Error('READ_FAIL'); }
  if (d && d.productos) return await runMigrations(normalize(d));
  // 2) BD vacía (primer arranque): migrar del localStorage antiguo si existe...
  try { const ls = JSON.parse(localStorage.getItem(DB_KEY)); if (ls && ls.productos){ const n=normalize(ls); await idbSet('db',n).catch(()=>{}); return n; } } catch(e){}
  // 3) ...o sembrar datos demo (solo cuando de verdad no había nada).
  const s = seed(); try { await idbSet('db',s); } catch(e){} return s;
}
function normalize(d) {
  ['productos','clientes','proveedores','ventas','compras','cotizaciones','movimientos','notascredito','notasdebito','guias','caja','gastos','ordenescompra','importaciones','letras','retenciones','percepciones','cierres','empresas','cobranzas','pagosprov','series','usuarios'].forEach(k => { if(!Array.isArray(d[k])) d[k]=[]; });
  const s = seed();
  if(!Array.isArray(d.tipocambio) || !d.tipocambio.length) d.tipocambio = s.tipocambio;
  d.cat = d.cat || {};
  ['marcas','lineas','familias','modelos','servicios'].forEach(k => { if(!Array.isArray(d.cat[k])) d.cat[k]=s.cat[k]; });
  if(!d.schemaVersion) d.schemaVersion = SCHEMA_VERSION;
  return d;
}

/* Motor de migraciones: idempotente + reversible + backup-antes-de-migrar.
   Cada migración: { to: N, up: (d)=>void }. Se corren en orden solo si to > schemaVersion actual.
   Antes de aplicar cualquiera, se guarda copia previa bajo 'db_prev_v<n>' (para poder revertir). */
const MIGRATIONS = [
  // v2: correlativos por serie, sembrados desde los documentos existentes (continúa, no reinicia).
  { to:2, up:(d)=>{
    d.series = Array.isArray(d.series) ? d.series : [];
    const tail = (str)=>{ const m=String(str||'').match(/(\d+)\s*$/); return m?parseInt(m[1],10):0; };
    const bump = (tipo,serie,num)=>{ let e=d.series.find(s=>s.tipo===tipo&&s.serie===serie); if(!e){ e={tipo,serie,ultimo:0}; d.series.push(e); } if(num>e.ultimo) e.ultimo=num; };
    (d.ventas||[]).forEach(v=>{ const boleta=String(v.num||'').startsWith('B'); bump(boleta?'BOLETA':'FACTURA', boleta?'B001':'F001', tail(v.num)); });
    (d.cotizaciones||[]).forEach(c=>bump('COTIZACION','0001',tail(c.num)));
    (d.notascredito||[]).forEach(n=>bump('NOTA_CREDITO','FC01',tail(n.num)));
    (d.compras||[]).forEach(c=>bump('COMPRA','F-',tail(c.num)));
    [['FACTURA','F001'],['BOLETA','B001'],['COTIZACION','0001'],['NOTA_CREDITO','FC01'],['COMPRA','F-']].forEach(([t,s])=>bump(t,s,0));
  }},
  // v3: usuarios + roles. Crea un administrador por defecto si no existen.
  { to:3, up:(d)=>{
    if(!Array.isArray(d.usuarios) || !d.usuarios.length){
      d.usuarios = [
        { id:'u-admin', nombre:'Angelo', usuario:'admin', pin:'1234', rol:'admin', activo:true },
        { id:'u-vend', nombre:'Vendedor', usuario:'vendedor', pin:'0000', rol:'vendedor', activo:true },
      ];
    }
  }},
  // v4: cuentas corrientes con abono parcial. Inicializa saldo/abonado desde el estado
  // actual de cada documento (Pagada → saldo 0; cualquier otro → saldo = total) y crea
  // los arrays de recibos + sus correlativos. Idempotente (solo toca lo que falta).
  { to:4, up:(d)=>{
    const R=n=>Math.round((Number(n)||0)*100)/100;
    const init=(arr)=>(arr||[]).forEach(x=>{ if(x.saldo==null){ const pag=x.estado==='Pagada'||x.estado==='Anulada'; x.abonado=pag&&x.estado==='Pagada'?R(x.total):0; x.saldo=pag?0:R(x.total); } });
    init(d.ventas); init(d.compras);
    if(!Array.isArray(d.cobranzas)) d.cobranzas=[];
    if(!Array.isArray(d.pagosprov)) d.pagosprov=[];
    d.series=Array.isArray(d.series)?d.series:[];
    if(!d.series.find(s=>s.tipo==='COBRANZA')) d.series.push({tipo:'COBRANZA',serie:'RC01',ultimo:0});
    if(!d.series.find(s=>s.tipo==='PAGO')) d.series.push({tipo:'PAGO',serie:'EG01',ultimo:0});
  }},
];
async function runMigrations(d){
  const from = Number(d.schemaVersion) || 1;
  const pending = MIGRATIONS.filter(m=>m.to>from).sort((a,b)=>a.to-b.to);
  if(!pending.length){ d.schemaVersion = SCHEMA_VERSION; return d; }
  try { await idbSet('db_prev_v'+from, d); } catch(e){ console.warn('no se pudo guardar backup pre-migración', e); }
  for(const m of pending){ m.up(d); d.schemaVersion = m.to; }
  d.schemaVersion = SCHEMA_VERSION;
  return d;
}
/* Correlativos por serie. nextNumero() DEBE llamarse DENTRO de commit() para que el
   contador y el documento se guarden (o se reviertan) juntos → sin huecos ni colisiones. */
const SERIES = {
  FACTURA:      { serie:'F001', pad:6, sep:'-' },
  BOLETA:       { serie:'B001', pad:6, sep:'-' },
  COTIZACION:   { serie:'0001', pad:8, sep:'-' },
  NOTA_CREDITO: { serie:'FC01', pad:6, sep:'-' },
  NOTA_DEBITO:  { serie:'FD01', pad:6, sep:'-' },
  GUIA:         { serie:'T001', pad:6, sep:'-' },
  RETENCION:    { serie:'R001', pad:6, sep:'-' },
  PERCEPCION:   { serie:'P001', pad:6, sep:'-' },
  COMPRA:       { serie:'F-',   pad:0, sep:''  },
  COBRANZA:     { serie:'RC01', pad:6, sep:'-' },
  PAGO:         { serie:'EG01', pad:6, sep:'-' },
};
function nextNumero(tipo){
  const cfg=SERIES[tipo]; if(!cfg) throw new Error('tipo de documento desconocido: '+tipo);
  if(!Array.isArray(DB.series)) DB.series=[];
  let e=DB.series.find(s=>s.tipo===tipo && s.serie===cfg.serie);
  if(!e){ e={tipo, serie:cfg.serie, ultimo:0}; DB.series.push(e); }
  e.ultimo++;
  const n = cfg.pad ? String(e.ultimo).padStart(cfg.pad,'0') : String(e.ultimo);
  return cfg.serie + cfg.sep + n;
}
function save(){ return idbSet('db',DB).catch(e=>{ console.warn('save error',e); throw e; }); }

/* Guardado confiable: indicador de estado + persist() que se puede await/rollback.
   Reemplaza el patrón antiguo 'save() fire-and-forget' en operaciones que mueven dinero. */
let _saveTimer=null;
function setSaveStatus(state){
  const el=document.getElementById('saveStatus'); if(!el) return;
  clearTimeout(_saveTimer);
  if(state==='saving'){ el.textContent='Guardando…'; el.className='save-status saving'; }
  else if(state==='saved'){ el.textContent='✓ Guardado'; el.className='save-status saved'; _saveTimer=setTimeout(()=>{ el.textContent=''; el.className='save-status'; },1600); }
  else if(state==='error'){ el.textContent='⚠ No se guardó — reintenta'; el.className='save-status error'; }
}
async function persist(){ setSaveStatus('saving'); try { await save(); setSaveStatus('saved'); autoBackupTick(); return true; } catch(e){ setSaveStatus('error'); throw e; } }

/* Commit atómico: snapshot completo de la BD → mutar → guardar. Si algo falla, revierte TODO.
   Consolida el rollback por-operación de la Fase 0 en una sola primitiva (cubre stock, kardex, ventas, todo). */
async function commit(mutate){
  const backup = structuredClone(DB);
  try {
    const r = mutate();
    if (r instanceof Promise) await r;
    await persist();
  } catch(e){
    DB = backup;            // restaura el estado completo previo
    setSaveStatus('error');
    throw e;
  }
}
/* Auto-backup rotativo en IndexedDB: punto de recuperación cada N guardados (best-effort). */
let _saveCount = 0;
function autoBackupTick(){
  _saveCount++;
  if(_saveCount % 10 !== 0) return;
  idbSet('db_autobackup', { ts: new Date().toISOString(), data: DB }).catch(()=>{});
}

function exportProductos(){
  const cols=['codigo','codFab','desc','marca','linea','origen','um','costo','moneda','precio','precioSug','precioMayor','precioTaller','precioFlota','ubicacion','stock','stockMin'];
  const rows=[cols.join(',')].concat(DB.productos.map(p=>cols.map(c=>csvCell(p[c])).join(',')));
  downloadCSV('productos.csv', rows.join('\n'));
  toast('Productos exportados a CSV','success');
}
function importProductos(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const rows=parseCSV(r.result); if(rows.length<2){toast('Archivo vacío','error');return;}
      const head=rows[0].map(h=>h.trim().toLowerCase());
      const nuevos=[];
      rows.slice(1).forEach(cols=>{
        if(!cols.length||!cols.join('')) return;
        const o={}; head.forEach((h,i)=>o[h]=cols[i]);
        const pri=parseInt(o.pri)||0, cie=parseInt(o.cie)||0, vit=parseInt(o.vit)||0, mer=parseInt(o.mer)||0;
        nuevos.push({ id:uid(), codigo:o.codigo||o.codproducto||('IMP-'+nuevos.length), codFab:o.codfab||o.codigoreeim||o.codigoalternativo||'', desc:o.desc||o.descripcion||o.producto||'', marca:o.marca||'', linea:o.linea||'', origen:o.origen||'', um:o.um||'UND', costo:parseFloat(o.costo)||0, moneda:o.moneda||'S/', precio:parseFloat(o.precio)||0, precioSug:parseFloat(o.preciosug)||0, precioMayor:parseFloat(o.preciomayor)||0, precioTaller:parseFloat(o.preciotaller)||0, precioFlota:parseFloat(o.precioflota)||0, ubicacion:o.ubicacion||'', stock:parseInt(o.stock)||parseInt(o.total)||(pri+cie+vit)||0, stockMin:parseInt(o.stockmin)||0, pri, cie, vit, mer });
      });
      const reemplazar = DB.productos.length>0 ? confirm(`Se leyeron ${nuevos.length} productos del archivo.\n\nAceptar = REEMPLAZAR el catálogo actual\nCancelar = AÑADIR a los productos existentes`) : true;
      DB.productos = reemplazar ? nuevos : nuevos.concat(DB.productos);
      invalidarBlob();
      prodFilter.page=1;
      renderProdTable(); renderNav();
      save()
        .then(()=>toast(`${nuevos.length} productos cargados y guardados`,'success'))
        .catch(()=>toast('Cargados en esta sesión, pero no se pudieron guardar','error'));
    }catch(err){ toast('Error al leer el archivo','error'); }
    e.target.value='';
  };
  r.readAsText(file);
}

// Niveles de precio: mostrador (base) / taller / flota. El cliente tiene un nivel asignado.
const NIVELES = { mostrador:'Mostrador', mayor:'Por Mayor', taller:'Taller', flota:'Flota' };
function precioNivel(p, nivel){
  if(nivel==='mayor' && Number(p.precioMayor)>0) return Number(p.precioMayor);
  if(nivel==='taller' && Number(p.precioTaller)>0) return Number(p.precioTaller);
  if(nivel==='flota' && Number(p.precioFlota)>0) return Number(p.precioFlota);
  return Number(p.precio)||0;
}
function clienteNivel(clienteId){ const c=DB.clientes.find(x=>x.id===clienteId); return (c&&c.nivelPrecio)||'mostrador'; }
function ventaPrecioSoles(p){ const base=precioNivel(p, clienteNivel(venta.clienteId)); return p.moneda==='$' ? base*(Number(venta.tc)||1) : base; }
// Costo del producto convertido a soles (para snapshot en la venta y márgenes reales).
function costoSoles(p, tc){ const c=Number(p.costo)||0; return p.moneda==='$' ? c*(Number(tc)||tcActual()) : c; }
function loadCotizIntoVenta(id){
  const c=DB.cotizaciones.find(x=>x.id===id); if(!c) return;

  drawVenta();
}

function deductStock(p,qty){
  if(p.pri===undefined && p.cie===undefined && p.vit===undefined){ p.stock=Math.max(0,(Number(p.stock)||0)-qty); return; }
  let q=qty; for(const k of ['pri','cie','vit']){ const have=Number(p[k])||0; const take=Math.min(have,q); p[k]=have-take; q-=take; if(q<=0)break; }
  p.stock=(Number(p.pri)||0)+(Number(p.cie)||0)+(Number(p.vit)||0);
}
function addStock(p,qty){
  if(p.pri===undefined && p.cie===undefined && p.vit===undefined){ p.stock=(Number(p.stock)||0)+qty; return; }
  p.pri=(Number(p.pri)||0)+qty;
  p.stock=(Number(p.pri)||0)+(Number(p.cie)||0)+(Number(p.vit)||0);
}
// Registra un movimiento de kardex. `extra` (opcional) enriquece: {razon, costo, precio, tc, moneda, almacen}.
// Por defecto guarda una foto del costo del producto en ese momento (para valorizar el kardex).
function recordMov(p,tipo,doc,cant,extra){ DB.movimientos.push(Object.assign({ id:uid(), fecha:new Date().toISOString().slice(0,10), prodId:p.id, codigo:p.codigo, desc:p.desc, tipo, doc, cant, costo:Number(p.costo)||0, moneda:p.moneda||'S/', usuario:usuarioActual() }, extra||{})); }
let emitLock=false;
// Disponible = stock físico menos lo reservado (comprometido) por cotizaciones.
function disponible(p){ return (Number(p.stock)||0) - (Number(p.reservado)||0); }
// Valida que haya stock DISPONIBLE suficiente. Devuelve [] si ok, o lista de faltantes.
function validarStock(lines){
  const need={};
  lines.forEach(l=>{ need[l.prodId]=(need[l.prodId]||0)+Number(l.cant||0); });
  const faltantes=[];
  Object.keys(need).forEach(pid=>{ const p=DB.productos.find(x=>x.id===pid); if(!p) return; const disp=disponible(p); if(need[pid]>disp) faltantes.push(`${p.desc}: pide ${need[pid]}, hay ${disp}`); });
  return faltantes;
}
// Crédito del cliente: deuda pendiente + esta venta no debe superar su línea.
function deudaCliente(clienteId){
  const vv=DB.ventas.filter(v=>v.clienteId===clienteId && esPendienteDoc(v)).reduce((s,v)=>s+docSaldo(v),0);
  const nd=(DB.notasdebito||[]).filter(n=>n.clienteId===clienteId && n.estado==='Pendiente').reduce((s,n)=>s+Number(n.total||0),0);
  // Deuda que ya pasó a letras (canje) sigue contando para el crédito: la factura se canjeó, pero el cliente aún debe.
  const lt=(DB.letras||[]).filter(l=>l.tipo==='cobrar' && l.entidadId===clienteId && l.estado!=='Pagada').reduce((s,l)=>s+Number(l.saldo!=null?l.saldo:l.monto||0),0);
  return vv+nd+lt;
}
function chequeoCredito(clienteId, total){
  const c=DB.clientes.find(x=>x.id===clienteId); if(!c) return {ok:true};
  if(c.bloqueoCredito) return {ok:false, msg:`${c.nombre} tiene el crédito BLOQUEADO. La venta debe ser al contado.`};
  const linea=Number(c.credito)||0;
  if(linea<=0) return {ok:false, msg:`${c.nombre} no tiene línea de crédito. La venta debe ser al contado.`};
  const deuda=deudaCliente(clienteId);
  if(deuda+total > linea) return {ok:false, msg:`Excede el crédito de ${c.nombre}. Línea ${money(linea)}, deuda ${money(deuda)}, esta venta ${money(total)}.`};
  return {ok:true};
}
function snapshotStock(lines){ return lines.map(l=>{ const p=DB.productos.find(x=>x.id===l.prodId); return p?{p,pri:p.pri,cie:p.cie,vit:p.vit,mer:p.mer,stock:p.stock}:null; }).filter(Boolean); }
function restoreStock(snap){ snap.forEach(s=>{ s.p.pri=s.pri; s.p.cie=s.cie; s.p.vit=s.vit; s.p.mer=s.mer; s.p.stock=s.stock; }); }
async function emitirVenta(){
  if(emitLock) return;
  const faltantes=validarStock(venta.lines);
  if(faltantes.length){ toast('Stock insuficiente — '+faltantes.join(' · '),'error'); return; }
  const cli=DB.clientes.find(c=>c.id===venta.clienteId);
  const base=venta.lines.reduce((s,l)=>s+(Number(l.valor)||0)*l.cant,0);
  const igv=base*0.18, total=base+igv;
  if(venta.metodo==='Crédito'){
    const chk=chequeoCredito(venta.clienteId, total);
    if(!chk.ok){ if(!esAdmin()){ toast(chk.msg,'error'); return; } if(!confirm(chk.msg+'\n\n¿Autorizar la venta de todos modos? (queda registrado)')) return; }
  }
  emitLock=true; const btn=document.getElementById('emitBtn'); if(btn) btn.disabled=true;
  let num;
  const lineas = venta.lines.map(l=>{const p=DB.productos.find(x=>x.id===l.prodId);return {prodId:l.prodId,codigo:p.codigo,desc:p.desc,marca:p.marca||'',cant:l.cant,precio:Number(l.valor)||0,costo:costoSoles(p,venta.tc)};});
  try {
    await commit(()=>{
      num = nextNumero(venta.tipo==='Boleta'?'BOLETA':'FACTURA');
      venta.lines.forEach(l=>{const p=DB.productos.find(x=>x.id===l.prodId);deductStock(p,l.cant);recordMov(p,'VENTA',num,-l.cant,{razon:(cli?cli.nombre:'Cliente varios'),precio:Number(l.precio)||0,tc:venta.tc,moneda:venta.moneda||'S/'});});
      DB.ventas.unshift({ id:uid(), num, fecha:new Date().toISOString().slice(0,10), clienteId:venta.clienteId, cliente:cli?cli.nombre:'Cliente varios', items:venta.lines.reduce((s,l)=>s+l.cant,0), subtotal:base, igv, total, estado:venta.metodo==='Crédito'?'Pendiente':'Pagada', saldo:(venta.metodo==='Crédito'?total:0), abonado:(venta.metodo==='Crédito'?0:total), metodo:venta.metodo, tc:venta.tc, referencia:venta.fromCotiz||'', vendedor:venta.vendedor||'', placa:venta.placa||'', oc:venta.oc||'', nota:venta.nota||'', correo:venta.correo||'', usuario:usuarioActual(), creado:new Date().toISOString(), lineas });
    });
  } catch(e){
    emitLock=false; if(btn) btn.disabled=false;
    toast('No se pudo guardar la venta. No se descontó stock. Reintenta.','error');
    return;
  }
  renderNav();
  toast((venta.tipo||'Venta')+' '+num+' emitida · '+money(total),'success');
  emitLock=false;
  document.querySelector('#segV button[data-t="lista"]').click();
}

VIEWS.compras=(el)=>{ placeholderView(el,'Compras','Registra facturas de compra y aumenta tu stock automáticamente.','compras',['Registro de facturas de compra','Ingreso automático a inventario','Cuentas por pagar a proveedores']); };
/* ================== CUENTAS CORRIENTES — Cobranzas / Pagos ==================
   Registro real de cobros/pagos: abono parcial (a cuenta) por documento, saldo nuevo en
   vivo, medio de pago + banco/cuenta/caja/cobrador, y recibo con historial e impresión.
   CxC y CxP son ESPEJO → un solo motor. El cálculo de dinero está aislado y testeado. */
const R2 = n => Math.round((Number(n)||0)*100)/100;
function docSaldo(d){
  if(!d) return 0;
  if(d.estado==='Anulada') return 0;
  if(d.saldo!=null) return Math.max(0, Number(d.saldo)||0);
  return d.estado==='Pagada' ? 0 : (Number(d.total)||0);   // defensivo con docs previos a la migración v4
}
function esPendienteDoc(d){ return d && d.estado!=='Anulada' && docSaldo(d) > 0.005; }
function estadoPorSaldo(d){ const s=docSaldo(d), t=Number(d.total)||0; return s<=0.005 ? 'Pagada' : (s < t-0.005 ? 'Parcial' : 'Pendiente'); }
/* Aplica abonos a un conjunto de documentos. PURO y testeable.
   aplic = [{docId, abono}] → muta cada doc (saldo, abonado, estado). Devuelve {aplicado, errores}. */
function aplicarAbonos(docs, aplic){
  let aplicado=0; const errores=[];
  (aplic||[]).forEach(a=>{
    const abono=R2(a.abono); if(abono<=0) return;
    const d=(docs||[]).find(x=>x.id===a.docId);
    if(!d){ errores.push('Documento no encontrado'); return; }
    const saldo=docSaldo(d);
    if(abono - saldo > 0.005){ errores.push('El abono de '+abono+' supera el saldo de '+saldo+(d.num?' ('+d.num+')':'')); return; }
    d.abonado=R2((Number(d.abonado)||0)+abono);
    d.saldo=R2(saldo-abono);
    d.estado=estadoPorSaldo(d);
    aplicado=R2(aplicado+abono);
  });
  return { aplicado:R2(aplicado), errores };
}
/* Revierte los abonos de un recibo (al anularlo): devuelve el saldo a cada documento. */
function revertirAbonos(docs, aplicaciones){
  (aplicaciones||[]).forEach(a=>{
    const d=(docs||[]).find(x=>x.id===a.docId); if(!d) return;
    const prev=docSaldo(d);
    d.abonado=Math.max(0, R2((Number(d.abonado)||0)-Number(a.abono||0)));
    d.saldo=R2(prev+Number(a.abono||0));
    if(d.estado!=='Anulada') d.estado=estadoPorSaldo(d);
  });
}
function totalPorCobrar(){ return R2(DB.ventas.reduce((s,v)=>s+docSaldo(v),0)); }
function totalPorPagar(){ return R2(DB.compras.reduce((s,c)=>s+docSaldo(c),0)); }

/* Reporte de cobranzas/pagos (PURO/testeable). Filtra recibos (excluye anulados) por
   entidad, medio, y rango de fechas; devuelve la lista y el total. */
function filtrarRecibos(recibos, f){
  f=f||{};
  let list=(recibos||[]).filter(r=>r.estado!=='Anulado');
  if(f.entidad) list=list.filter(r=>r.entidad===f.entidad);
  if(f.medio) list=list.filter(r=>r.medio===f.medio);
  if(f.desde) list=list.filter(r=>String(r.fecha||'')>=f.desde);
  if(f.hasta) list=list.filter(r=>String(r.fecha||'')<=f.hasta);
  list=list.slice().sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));
  return { list, total:R2(list.reduce((s,r)=>s+Number(r.total||0),0)) };
}
function sumarizarRecibos(list){
  const m={};
  (list||[]).forEach(r=>{ const k=r.entidad||'—'; if(!m[k]) m[k]={entidad:k, n:0, total:0}; m[k].n++; m[k].total+=Number(r.total||0); });
  return Object.values(m).map(x=>({ entidad:x.entidad, n:x.n, total:R2(x.total) })).sort((a,b)=>b.total-a.total);
}

        <div style="padding:16px;border-top:1px solid var(--line)"><button class="btn btn-primary" id="ccGrabar" style="width:100%">${ICN.check} Registrar ${cfg.accion}</button></div>
      </div>
    </div>`;
  document.getElementById('ccEnt').onchange=e=>{ st.ent=e.target.value; st.abonos={}; ccRenderReg(key); };
  document.getElementById('ccEstado').onchange=e=>{ st.estado=e.target.value; ccRenderReg(key); };
  document.getElementById('ccGrabar').onclick=()=>ccGrabar(key);
  ccRenderDocs(key);
}
function ccRenderDocs(key){
  const cfg=CCFG[key], st=CC[key];
  const wrap=document.getElementById('ccDocs'); if(!wrap) return;
  const list=ccFiltradas(key);
  wrap.innerHTML=`<table><thead><tr><th>${cfg.entLabel}</th><th>Documento</th><th>Emisión</th><th>Vcto</th><th style="text-align:right">Total</th><th style="text-align:right">Saldo</th><th style="text-align:right">A cuenta</th><th style="text-align:right">Saldo nuevo</th><th></th></tr></thead><tbody>
    ${list.map(d=>{ const s=docSaldo(d), ab=Number(st.abonos[d.id])||0, mon=d.moneda||'S/';
      return `<tr>
        <td>${d[cfg.entKey]||'—'}</td>

        <td>${fmtDate(d.fecha)}</td>
        <td>${fmtDate(d.vcto)}</td>
        <td style="text-align:right">${money2(d.total,mon)}</td>
        <td style="text-align:right" class="cell-strong">${money2(s,mon)}</td>
        <td style="text-align:right"><input class="cc-abono" data-id="${d.id}" data-saldo="${s}" data-mon="${mon}" type="number" min="0" step="0.01" value="${ab>0?ab:''}" placeholder="0.00" style="width:112px;text-align:right"></td>
        <td style="text-align:right" id="sn-${d.id}" class="cell-mono">${money2(s-ab,mon)}</td>
        <td><button class="btn btn-ghost btn-sm" data-full="${d.id}">Todo</button></td>
      </tr>`; }).join('')||emptyRow(9)}
  </tbody></table>`;
  wrap.querySelectorAll('.cc-abono').forEach(inp=>{
    inp.oninput=()=>{ let v=Number(inp.value)||0; const s=Number(inp.dataset.saldo)||0; const mon=inp.dataset.mon||'S/';
      if(v<0)v=0; if(v>s){ v=s; inp.value=R2(s); } st.abonos[inp.dataset.id]=v;
      const sn=document.getElementById('sn-'+inp.dataset.id); if(sn) sn.textContent=money2(s-v,mon); ccTotalRefresh(key); };
  });
  wrap.querySelectorAll('[data-full]').forEach(b=>b.onclick=()=>{ const inp=wrap.querySelector('.cc-abono[data-id="'+b.dataset.full+'"]'); if(inp){ inp.value=inp.dataset.saldo; inp.oninput(); } });
  ccTotalRefresh(key);
}
function ccTotalRefresh(key){
  const st=CC[key]; let total=0, n=0;
  Object.values(st.abonos).forEach(v=>{ v=Number(v)||0; if(v>0){ total+=v; n++; } });
  const t=document.getElementById('ccTotal'); if(t) t.textContent=money(R2(total));
  const c=document.getElementById('ccCount'); if(c) c.textContent=n+' documento'+(n===1?'':'s')+' seleccionado'+(n===1?'':'s');
}
function ccGrabar(key){
  const cfg=CCFG[key], st=CC[key];
  const aplic=Object.entries(st.abonos).map(([docId,abono])=>({docId,abono:Number(abono)||0})).filter(a=>a.abono>0);
  if(!aplic.length){ toast('Ingresa al menos un abono a cuenta','error'); return; }
  const meta={ fecha:val('cc_fecha')||new Date().toISOString().slice(0,10), medio:val('cc_medio')||'Efectivo', banco:val('cc_banco'), cuenta:val('cc_cuenta'),
    persona:(document.getElementById('cc_persona')||{}).value||'', caja:val('cc_caja'), moneda:val('cc_moneda')||'S/', tc:Number(val('cc_tc'))||tcActual(), obs:val('cc_obs') };
  const ent = st.ent || (()=>{ const d=cfg.docs().find(x=>x.id===aplic[0].docId); return d?d[cfg.entKey]:''; })();
  const btn=document.getElementById('ccGrabar'); if(btn) btn.disabled=true;
  commit(()=>{
    const res=aplicarAbonos(cfg.docs(), aplic);
    if(res.errores.length) throw new Error(res.errores[0]);
    const detalle=aplic.map(a=>{ const d=cfg.docs().find(x=>x.id===a.docId); return { docId:a.docId, num:d?d.num:'', abono:R2(a.abono) }; });
    const rec={ id:uid(), num:nextNumero(cfg.serie), tipo:cfg.tipo, fecha:meta.fecha, entidad:ent,
      medio:meta.medio, banco:meta.banco, cuenta:meta.cuenta, persona:meta.persona, caja:meta.caja,
      moneda:meta.moneda, tc:meta.tc, total:res.aplicado, obs:meta.obs, estado:'Registrado',
      usuario:usuarioActual(), creado:new Date().toISOString(), aplicaciones:detalle };
    cfg.arr().push(rec); st._ultimo=rec;
  }).then(()=>{
    const rec=st._ultimo; st._ultimo=null; st.abonos={};
    toast(cfg.Accion+' '+(rec?rec.num:'')+' registrado','success');
    if(rec) ccPrintRecibo(rec, key);
    go(cfg.view);
  }).catch(e=>{ if(btn) btn.disabled=false; toast('No se pudo registrar: '+(e.message||''),'error'); });
}
function ccRenderCon(key){

  body.innerHTML=`<div class="kpi-grid" style="margin-bottom:18px">${kpiCard('cobrar',cfg.color,cfg.soft,'Total '+cfg.accion+'s (vigentes)',money(totReg),recibos.filter(r=>r.estado!=='Anulado').length+' recibos',null)}</div>

    ${recibos.map(r=>`<tr>

      <td><div class="row-actions"><button class="icon-btn" data-print="${r.id}" title="Imprimir">${ICN.print}</button>${r.estado!=='Anulado'?`<button class="icon-btn del" data-anular="${r.id}" title="Anular">${ICN.del}</button>`:''}</div></td>
    </tr>`).join('')||emptyRow(8)}
    </tbody></table></div></div>`;
  body.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{ const r=cfg.arr().find(x=>x.id===b.dataset.print); if(r) ccPrintRecibo(r,key); });
  body.querySelectorAll('[data-anular]').forEach(b=>b.onclick=()=>{ const r=cfg.arr().find(x=>x.id===b.dataset.anular);
    confirmDialog('¿Anular recibo '+r.num+'?','Se devolverá el saldo a los documentos abonados. El recibo queda como Anulado (no se borra).',()=>{
      commit(()=>{ revertirAbonos(cfg.docs(), r.aplicaciones); const rr=cfg.arr().find(x=>x.id===r.id); rr.estado='Anulado'; rr.anuladoPor=usuarioActual(); })
        .then(()=>{ toast('Recibo anulado','success'); go(cfg.view); })
        .catch(()=>toast('No se pudo anular','error'));
    });
  });
}
