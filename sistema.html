<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SGAE · Sistema de Gestión</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --sidebar: #141414;
    --sidebar-hover: #242424;
    --sidebar-active: #e01f26;
    --ink: #171717;
    --ink-2: #52525b;
    --ink-3: #9ca3af;
    --line: #e6e7eb;
    --brand: #e01f26;
    --brand-2: #b8151b;
    --brand-soft: #fdeaea;
    --green: #16a34a;
    --green-soft: #dcfce7;
    --red: #dc2626;
    --red-soft: #fee2e2;
    --amber: #d97706;
    --amber-soft: #fef3c7;
    --purple: #7c3aed;
    --purple-soft: #f3e8ff;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
    --shadow-lg: 0 10px 40px rgba(15,23,42,.16);
    --radius: 14px;
    --radius-sm: 9px;
    --sidebar-w: 256px;
  }
  [data-theme="dark"] {
    --bg: #0d0d0f;
    --surface: #18181b;
    --surface-2: #131315;
    --sidebar: #000000;
    --sidebar-hover: #1c1c1f;
    --ink: #f4f4f5;
    --ink-2: #a1a1aa;
    --ink-3: #71717a;
    --line: #27272a;
    --brand-soft: #2a1213;
    --green-soft: #10281c;
    --red-soft: #2c1618;
    --amber-soft: #2a2110;
    --purple-soft: #1f1633;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--brand); color: #fff; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--ink-3); border-radius: 20px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar);
    color: #cbd5e1;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    z-index: 60;
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 22px 18px;
  }
  .brand-logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, #e01f26, #a10f14);
    display: grid; place-items: center;
    color: #fff; font-weight: 900; font-size: 17px; letter-spacing: -.5px;
    box-shadow: 0 6px 18px rgba(224,31,38,.45);
    overflow: hidden;
  }
  .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
  .placeholder-x {
  }
  .brand-name { color: #fff; font-weight: 700; font-size: 16px; letter-spacing: .2px; line-height: 1.1; }
  .brand-sub { color: #64748b; font-size: 11px; font-weight: 500; }
  .nav { flex: 1; overflow-y: auto; padding: 8px 12px 20px; }
  .nav::-webkit-scrollbar { width: 6px; }
  .nav::-webkit-scrollbar-thumb { background: #334155; border: none; }
  .nav-group-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .8px;
    color: #475569; font-weight: 700; padding: 16px 12px 7px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: #cbd5e1; font-weight: 500; font-size: 13.5px;
    transition: background .15s, color .15s; position: relative;
    width: 100%; text-align: left;
  }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
  .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
  .nav-item.active { background: var(--sidebar-active); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.4); }
  .nav-item.active svg { opacity: 1; }
  .nav-badge {
    margin-left: auto; background: #334155; color: #cbd5e1;
    font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
  }
  .nav-item.active .nav-badge { background: rgba(255,255,255,.25); color: #fff; }
  .nav-parent .chev { margin-left: auto; width: 15px; height: 15px; opacity: .55; transition: transform .2s; }
  .nav-parent.open .chev { transform: rotate(90deg); opacity: .9; }
  .nav-parent.has-active { color: #fff; }
  .nav-sub { display: none; margin: 1px 0 5px; }
  .nav-sub.open { display: block; animation: navFade .18s ease; }
  @keyframes navFade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .nav-subitem { padding: 8px 12px 8px 42px; font-size: 13px; color: #9095a0; }
  .nav-subitem::before { content: ''; position: absolute; left: 25px; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: #3f3f46; transform: translateY(-50%); transition: background .15s; }
  .nav-subitem:hover::before { background: #71717a; }
  .nav-subitem.active { background: var(--sidebar-active); color: #fff; }
  .nav-subitem.active::before { background: #fff; }
  .sidebar-foot { padding: 14px; border-top: 1px solid rgba(255,255,255,.06); }
  .user-chip {
    display: flex; align-items: center; gap: 11px; padding: 8px; border-radius: 10px;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg,#f59e0b,#ef4444);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px;
  }
  .user-name { color: #fff; font-weight: 600; font-size: 13px; }
  .user-role { color: #64748b; font-size: 11px; }

  /* ---------- Main ---------- */
  .main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 64px; background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px; position: sticky; top: 0; z-index: 40;
  }
  .hamburger { display: none; }
  .page-title { font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  .search {
    margin-left: auto; display: flex; align-items: center; gap: 9px;
    background: var(--surface-2); border: 1px solid var(--line);
    padding: 9px 14px; border-radius: 10px; width: 320px; max-width: 40vw;
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .search svg { width: 16px; height: 16px; color: var(--ink-3); }
  .search input { border: none; background: none; outline: none; width: 100%; }
  .global-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); max-height: 440px; overflow-y: auto; display: none; z-index: 60; }
  .global-results.open { display: block; }
  .gr-sec { padding: 9px 14px 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-3); font-weight: 700; }
  .gr-item { padding: 9px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; border-top: 1px solid var(--line); }
  .gr-item:hover { background: var(--surface-2); }
  .sres { padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .sres:hover, .sres.hl { background: var(--surface-2); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    color: var(--ink-2); transition: background .15s;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 19px; height: 19px; }
  .save-status { font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: color .2s; }
  .save-status.saving { color: var(--ink-3); }
  .save-status.saved { color: var(--green); }
  .save-status.error { color: var(--red); cursor: default; }

  .content { padding: 28px; max-width: 1400px; width: 100%; margin: 0 auto; }

  /* ---------- Common ---------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .page-head h1 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
  .page-head p { color: var(--ink-2); margin-top: 3px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
    transition: transform .08s, background .15s, box-shadow .15s;
  }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.3); }
  .btn-primary:hover { background: var(--brand-2); }
  .btn-ghost { background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn-danger { background: var(--red-soft); color: var(--red); }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }

  /* KPI grid */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 18px; margin-bottom: 26px; }
  .kpi { padding: 22px; position: relative; overflow: hidden; }
  .kpi-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 16px; }
  .kpi-icon svg { width: 22px; height: 22px; }
  .kpi-label { color: var(--ink-2); font-size: 13px; font-weight: 500; }
  .kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -.8px; margin-top: 4px; }
  .kpi-trend { font-size: 12px; font-weight: 600; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; }
  .up { color: var(--green); } .down { color: var(--red); }

  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }
  .section-title { font-size: 15px; font-weight: 700; padding: 18px 20px; border-bottom: 1px solid var(--line); display:flex; align-items:center; justify-content: space-between; }

  /* Table */
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar .search { margin-left: 0; width: 300px; }
  .filter-select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; font-weight: 500; cursor: pointer; outline: none;
  }
  .filter-select:focus { border-color: var(--brand); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
    color: var(--ink-3); font-weight: 700; padding: 13px 16px; border-bottom: 1px solid var(--line);
    background: var(--surface-2); white-space: nowrap; position: sticky; top: 0;
  }
  tbody td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  .cell-strong { font-weight: 600; }
  .cell-mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; color: var(--ink-2); }
  .badge { display: inline-flex; align-items:center; gap:5px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700; }
  .badge-green { background: var(--green-soft); color: var(--green); }
  .badge-red { background: var(--red-soft); color: var(--red); }
  .badge-amber { background: var(--amber-soft); color: var(--amber); }
  .badge-blue { background: var(--brand-soft); color: var(--brand); }
  .badge-gray { background: var(--surface-2); color: var(--ink-2); }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .row-actions .icon-btn { width: 32px; height: 32px; border-radius: 8px; }
  .row-actions .icon-btn svg { width: 15px; height: 15px; }
  .row-actions .icon-btn:hover { color: var(--brand); background: var(--brand-soft); }
  .row-actions .del:hover { color: var(--red); background: var(--red-soft); }

  .empty { text-align: center; padding: 60px 20px; color: var(--ink-3); }
  .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .5; }
  .empty h3 { color: var(--ink-2); font-size: 15px; margin-bottom: 4px; }

  /* Product image thumb */
  .thumb {
    width: 38px; height: 38px; border-radius: 9px; background: var(--surface-2);
    display: grid; place-items: center; color: var(--ink-3); font-weight: 700; font-size: 13px;
    border: 1px solid var(--line); flex-shrink: 0;
  }
  .prod-cell { display: flex; align-items: center; gap: 11px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(3px);
    display: none; align-items: flex-start; justify-content: center; z-index: 100; padding: 40px 20px; overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
    width: 100%; max-width: 680px; animation: pop .2s ease; margin: auto;
  }
  @keyframes pop { from { transform: scale(.96) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { font-size: 18px; font-weight: 700; }
  .modal-body { padding: 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .field label .req { color: var(--red); }
  .field input, .field select, .field textarea {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 24px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 18px 18px; }

  /* Toast */
  .toast-wrap { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
  .toast {
    background: var(--sidebar); color: #fff; padding: 13px 18px; border-radius: 12px;
    box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 11px; font-weight: 500;
    animation: slideIn .25s ease; min-width: 260px;
  }
  .toast svg { width: 20px; height: 20px; flex-shrink: 0; }
  .toast.success svg { color: #4ade80; } .toast.error svg { color: #f87171; }
  @keyframes slideIn { from { transform: translateX(120%); } to { transform: none; } }

  /* Ventas builder */
  .venta-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  .line-add { display: flex; gap: 10px; margin-bottom: 4px; }
  .cart-summary { padding: 20px; position: sticky; top: 84px; }
  .summ-row { display: flex; justify-content: space-between; padding: 7px 0; color: var(--ink-2); }
  .summ-row.total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; font-size: 20px; font-weight: 800; color: var(--ink); }
  .qty-input { width: 62px; text-align: center; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

  .segmented { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .segmented button { padding: 7px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
  .segmented button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .hidden { display: none !important; }

  /* Roles: el vendedor NO ve elementos marcados .solo-admin */
  .rol-vendedor .solo-admin { display: none !important; }

  /* Login */
  .login-screen { position: fixed; inset: 0; z-index: 300; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
  .login-screen.open { display: flex; }
  .login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 34px; width: 100%; max-width: 400px; text-align: center; }
  .login-users { display: flex; flex-direction: column; gap: 10px; }
  .login-user { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); transition: border-color .15s, background .15s; }
  .login-user:hover { border-color: var(--brand); background: var(--surface-2); }
  .pin-box { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  .pin-input { width: 180px; text-align: center; font-size: 24px; letter-spacing: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); outline: none; }
  .pin-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  @media (max-width: 1024px) {
    .grid-2 { grid-template-columns: 1fr; }
    .venta-layout { grid-template-columns: 1fr; }
    .cart-summary { position: static; }
  }
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
    .main { margin-left: 0; }
    .hamburger { display: grid; }
    .search { display: none; }
    .content { padding: 18px; }
    .form-grid { grid-template-columns: 1fr; }
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 55; display: none; }
    .scrim.open { display: block; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo">JL</div>
      <div>
        <div class="brand-name">JL REPUESTOS</div>
        <div class="brand-sub">Importaciones S.A.C.</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="user-chip" id="userChip"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn hamburger" id="hamburger" aria-label="Menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="page-title" id="pageTitle">Dashboard</div>
      <div id="searchWrap" style="margin-left:auto;position:relative">
        <div class="search" style="margin-left:0">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="globalSearch" placeholder="Buscar productos, clientes, cotizaciones...  ( / )" autocomplete="off" />
        </div>
        <div id="globalResults" class="global-results"></div>
      </div>
      <span id="saveStatus" class="save-status"></span>
      <button class="icon-btn" id="themeToggle" aria-label="Tema">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
      </button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="modal-overlay" id="modal"></div>
<div class="toast-wrap" id="toasts"></div>
<div id="loginScreen" class="login-screen"></div>

<script>
/* =====================================================================
   SGAE — Sistema de Gestión (moderno, single-file)
   Datos persistidos en localStorage. Sin dependencias externas.
   ===================================================================== */

/* ---------- Búsqueda normalizada (Fase 4) ----------
   norm() ignora guiones/espacios/mayúsculas → 'W712/75' y 'w71275' quedan iguales.
   Cada producto tiene un "blob" normalizado (código + reemplazo + nº de parte + desc + marca + línea),
   cacheado por id. La búsqueda parte la consulta en tokens y exige que TODOS estén en el blob
   (soporta "AMORTIG VOLVO", "últimos 6 dígitos" = subcadena, etc.). */
const _blob = new Map();
function norm(s){ return String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,''); }
function prodBlob(p){
  let b=_blob.get(p.id);
  if(b==null){ const pn=(p.partNumbers||[]).map(x=>x&&x.numero).join(' '); b=norm([p.codigo,p.codFab,p.desc,p.marca,p.linea,p.ubicacion,pn].join(' ')); _blob.set(p.id,b); }
  return b;
}
function invalidarBlob(id){ if(id) _blob.delete(id); else _blob.clear(); }
function buscarProductos(q, limit){
  const toks=String(q||'').split(/\s+/).map(norm).filter(Boolean);
  if(!toks.length) return [];
  const out=[];
  for(const p of DB.productos){ const b=prodBlob(p); if(toks.every(t=>b.includes(t))){ out.push(p); if(limit && out.length>=limit) break; } }
  return out;
}

/* Motor de guardado: IndexedDB (soporta cientos de MB → catálogo completo de 30k+) */
const IDB_NAME='sgae_db', IDB_STORE='kv';
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbGet(k){ return idbOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); })); }
function idbSet(k,v){ return idbOpen().then(db=>new Promise((res,rej)=>{ const t=db.transaction(IDB_STORE,'readwrite'); t.objectStore(IDB_STORE).put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); })); }

async function load(){
  // 1) Lectura de la BD local. Si FALLA la lectura (no "vacía"), abortar SIN sembrar:
  //    sembrar aquí sobrescribiría datos reales (los 897 productos) con el seed demo.
  let d;
  try { d = await idbGet('db'); }
  catch(e){ throw new Error('READ_FAIL'); }
  if (d && d.productos) return await runMigrations(normalize(d));
  // 2) BD vacía (primer arranque): migrar del localStorage antiguo si existe...
  try { const ls = JSON.parse(localStorage.getItem(DB_KEY)); if (ls && ls.productos){ const n=normalize(ls); await idbSet('db',n).catch(()=>{}); return n; } } catch(e){}
  // 3) ...o sembrar datos demo (solo cuando de verdad no había nada).
  const s = seed(); try { await idbSet('db',s); } catch(e){} return s;
}
function normalize(d) {
  ['productos','clientes','proveedores','ventas','compras','cotizaciones','movimientos','notascredito','notasdebito','guias','caja','gastos','ordenescompra','importaciones','letras','retenciones','percepciones','cierres','empresas','cobranzas','pagosprov','series','usuarios'].forEach(k => { if(!Array.isArray(d[k])) d[k]=[]; });
  const s = seed();
  if(!Array.isArray(d.tipocambio) || !d.tipocambio.length) d.tipocambio = s.tipocambio;
  d.cat = d.cat || {};
  ['marcas','lineas','familias','modelos','servicios'].forEach(k => { if(!Array.isArray(d.cat[k])) d.cat[k]=s.cat[k]; });
  if(!d.schemaVersion) d.schemaVersion = SCHEMA_VERSION;
  return d;
}

/* Motor de migraciones: idempotente + reversible + backup-antes-de-migrar.
   Cada migración: { to: N, up: (d)=>void }. Se corren en orden solo si to > schemaVersion actual.
   Antes de aplicar cualquiera, se guarda copia previa bajo 'db_prev_v<n>' (para poder revertir). */
const MIGRATIONS = [
  // v2: correlativos por serie, sembrados desde los documentos existentes (continúa, no reinicia).
  { to:2, up:(d)=>{
    d.series = Array.isArray(d.series) ? d.series : [];
    const tail = (str)=>{ const m=String(str||'').match(/(\d+)\s*$/); return m?parseInt(m[1],10):0; };
    const bump = (tipo,serie,num)=>{ let e=d.series.find(s=>s.tipo===tipo&&s.serie===serie); if(!e){ e={tipo,serie,ultimo:0}; d.series.push(e); } if(num>e.ultimo) e.ultimo=num; };
    (d.ventas||[]).forEach(v=>{ const boleta=String(v.num||'').startsWith('B'); bump(boleta?'BOLETA':'FACTURA', boleta?'B001':'F001', tail(v.num)); });
    (d.cotizaciones||[]).forEach(c=>bump('COTIZACION','0001',tail(c.num)));
    (d.notascredito||[]).forEach(n=>bump('NOTA_CREDITO','FC01',tail(n.num)));
    (d.compras||[]).forEach(c=>bump('COMPRA','F-',tail(c.num)));
    [['FACTURA','F001'],['BOLETA','B001'],['COTIZACION','0001'],['NOTA_CREDITO','FC01'],['COMPRA','F-']].forEach(([t,s])=>bump(t,s,0));
  }},
  // v3: usuarios + roles. Crea un administrador por defecto si no existen.
  { to:3, up:(d)=>{
    if(!Array.isArray(d.usuarios) || !d.usuarios.length){
      d.usuarios = [
        { id:'u-admin', nombre:'Angelo', usuario:'admin', pin:'1234', rol:'admin', activo:true },
        { id:'u-vend', nombre:'Vendedor', usuario:'vendedor', pin:'0000', rol:'vendedor', activo:true },
      ];
    }
  }},
  // v4: cuentas corrientes con abono parcial. Inicializa saldo/abonado desde el estado
  // actual de cada documento (Pagada → saldo 0; cualquier otro → saldo = total) y crea
  // los arrays de recibos + sus correlativos. Idempotente (solo toca lo que falta).
  { to:4, up:(d)=>{
    const R=n=>Math.round((Number(n)||0)*100)/100;
    const init=(arr)=>(arr||[]).forEach(x=>{ if(x.saldo==null){ const pag=x.estado==='Pagada'||x.estado==='Anulada'; x.abonado=pag&&x.estado==='Pagada'?R(x.total):0; x.saldo=pag?0:R(x.total); } });
    init(d.ventas); init(d.compras);
    if(!Array.isArray(d.cobranzas)) d.cobranzas=[];
    if(!Array.isArray(d.pagosprov)) d.pagosprov=[];
    d.series=Array.isArray(d.series)?d.series:[];
    if(!d.series.find(s=>s.tipo==='COBRANZA')) d.series.push({tipo:'COBRANZA',serie:'RC01',ultimo:0});
    if(!d.series.find(s=>s.tipo==='PAGO')) d.series.push({tipo:'PAGO',serie:'EG01',ultimo:0});
  }},
];
async function runMigrations(d){
  const from = Number(d.schemaVersion) || 1;
  const pending = MIGRATIONS.filter(m=>m.to>from).sort((a,b)=>a.to-b.to);
  if(!pending.length){ d.schemaVersion = SCHEMA_VERSION; return d; }
  try { await idbSet('db_prev_v'+from, d); } catch(e){ console.warn('no se pudo guardar backup pre-migración', e); }
  for(const m of pending){ m.up(d); d.schemaVersion = m.to; }
  d.schemaVersion = SCHEMA_VERSION;
  return d;
}
/* Correlativos por serie. nextNumero() DEBE llamarse DENTRO de commit() para que el
   contador y el documento se guarden (o se reviertan) juntos → sin huecos ni colisiones. */
const SERIES = {
  FACTURA:      { serie:'F001', pad:6, sep:'-' },
  BOLETA:       { serie:'B001', pad:6, sep:'-' },
  COTIZACION:   { serie:'0001', pad:8, sep:'-' },
  NOTA_CREDITO: { serie:'FC01', pad:6, sep:'-' },
  NOTA_DEBITO:  { serie:'FD01', pad:6, sep:'-' },
  GUIA:         { serie:'T001', pad:6, sep:'-' },
  RETENCION:    { serie:'R001', pad:6, sep:'-' },
  PERCEPCION:   { serie:'P001', pad:6, sep:'-' },
  COMPRA:       { serie:'F-',   pad:0, sep:''  },
  COBRANZA:     { serie:'RC01', pad:6, sep:'-' },
  PAGO:         { serie:'EG01', pad:6, sep:'-' },
};
function nextNumero(tipo){
  const cfg=SERIES[tipo]; if(!cfg) throw new Error('tipo de documento desconocido: '+tipo);
  if(!Array.isArray(DB.series)) DB.series=[];
  let e=DB.series.find(s=>s.tipo===tipo && s.serie===cfg.serie);
  if(!e){ e={tipo, serie:cfg.serie, ultimo:0}; DB.series.push(e); }
  e.ultimo++;
  const n = cfg.pad ? String(e.ultimo).padStart(cfg.pad,'0') : String(e.ultimo);
  return cfg.serie + cfg.sep + n;
}
function save(){ return idbSet('db',DB).catch(e=>{ console.warn('save error',e); throw e; }); }

/* Guardado confiable: indicador de estado + persist() que se puede await/rollback.
   Reemplaza el patrón antiguo 'save() fire-and-forget' en operaciones que mueven dinero. */
let _saveTimer=null;
function setSaveStatus(state){
  const el=document.getElementById('saveStatus'); if(!el) return;
  clearTimeout(_saveTimer);
  if(state==='saving'){ el.textContent='Guardando…'; el.className='save-status saving'; }
  else if(state==='saved'){ el.textContent='✓ Guardado'; el.className='save-status saved'; _saveTimer=setTimeout(()=>{ el.textContent=''; el.className='save-status'; },1600); }
  else if(state==='error'){ el.textContent='⚠ No se guardó — reintenta'; el.className='save-status error'; }
}
async function persist(){ setSaveStatus('saving'); try { await save(); setSaveStatus('saved'); autoBackupTick(); return true; } catch(e){ setSaveStatus('error'); throw e; } }

/* Commit atómico: snapshot completo de la BD → mutar → guardar. Si algo falla, revierte TODO.
   Consolida el rollback por-operación de la Fase 0 en una sola primitiva (cubre stock, kardex, ventas, todo). */
async function commit(mutate){
  const backup = structuredClone(DB);
  try {
    const r = mutate();
    if (r instanceof Promise) await r;
    await persist();
  } catch(e){
    DB = backup;            // restaura el estado completo previo
    setSaveStatus('error');
    throw e;
  }
}
/* Auto-backup rotativo en IndexedDB: punto de recuperación cada N guardados (best-effort). */
let _saveCount = 0;
function autoBackupTick(){
  _saveCount++;
  if(_saveCount % 10 !== 0) return;
  idbSet('db_autobackup', { ts: new Date().toISOString(), data: DB }).catch(()=>{});
}

function exportProductos(){
  const cols=['codigo','codFab','desc','marca','linea','origen','um','costo','moneda','precio','precioSug','precioMayor','precioTaller','precioFlota','ubicacion','stock','stockMin'];
  const rows=[cols.join(',')].concat(DB.productos.map(p=>cols.map(c=>csvCell(p[c])).join(',')));
  downloadCSV('productos.csv', rows.join('\n'));
  toast('Productos exportados a CSV','success');
}
function importProductos(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const rows=parseCSV(r.result); if(rows.length<2){toast('Archivo vacío','error');return;}
      const head=rows[0].map(h=>h.trim().toLowerCase());
      const nuevos=[];
      rows.slice(1).forEach(cols=>{
        if(!cols.length||!cols.join('')) return;
        const o={}; head.forEach((h,i)=>o[h]=cols[i]);
        const pri=parseInt(o.pri)||0, cie=parseInt(o.cie)||0, vit=parseInt(o.vit)||0, mer=parseInt(o.mer)||0;
        nuevos.push({ id:uid(), codigo:o.codigo||o.codproducto||('IMP-'+nuevos.length), codFab:o.codfab||o.codigoreeim||o.codigoalternativo||'', desc:o.desc||o.descripcion||o.producto||'', marca:o.marca||'', linea:o.linea||'', origen:o.origen||'', um:o.um||'UND', costo:parseFloat(o.costo)||0, moneda:o.moneda||'S/', precio:parseFloat(o.precio)||0, precioSug:parseFloat(o.preciosug)||0, precioMayor:parseFloat(o.preciomayor)||0, precioTaller:parseFloat(o.preciotaller)||0, precioFlota:parseFloat(o.precioflota)||0, ubicacion:o.ubicacion||'', stock:parseInt(o.stock)||parseInt(o.total)||(pri+cie+vit)||0, stockMin:parseInt(o.stockmin)||0, pri, cie, vit, mer });
      });
      const reemplazar = DB.productos.length>0 ? confirm(`Se leyeron ${nuevos.length} productos del archivo.\n\nAceptar = REEMPLAZAR el catálogo actual\nCancelar = AÑADIR a los productos existentes`) : true;
      DB.productos = reemplazar ? nuevos : nuevos.concat(DB.productos);
      invalidarBlob();
      prodFilter.page=1;
      renderProdTable(); renderNav();
      save()
        .then(()=>toast(`${nuevos.length} productos cargados y guardados`,'success'))
        .catch(()=>toast('Cargados en esta sesión, pero no se pudieron guardar','error'));
    }catch(err){ toast('Error al leer el archivo','error'); }
    e.target.value='';
  };
  r.readAsText(file);
}

const NIVELES = { mostrador:'Mostrador', mayor:'Por Mayor', taller:'Taller', flota:'Flota' };
function precioNivel(p, nivel){
  if(nivel==='mayor' && Number(p.precioMayor)>0) return Number(p.precioMayor);
  if(nivel==='taller' && Number(p.precioTaller)>0) return Number(p.precioTaller);
  if(nivel==='flota' && Number(p.precioFlota)>0) return Number(p.precioFlota);
  return Number(p.precio)||0;

// Costo del producto convertido a soles (para snapshot en la venta y márgenes reales).

function deductStock(p,qty){
  if(p.pri===undefined && p.cie===undefined && p.vit===undefined){ p.stock=Math.max(0,(Number(p.stock)||0)-qty); return; }
  let q=qty; for(const k of ['pri','cie','vit']){ const have=Number(p[k])||0; const take=Math.min(have,q); p[k]=have-take; q-=take; if(q<=0)break; }
  p.stock=(Number(p.pri)||0)+(Number(p.cie)||0)+(Number(p.vit)||0);
}
function addStock(p,qty){
  if(p.pri===undefined && p.cie===undefined && p.vit===undefined){ p.stock=(Number(p.stock)||0)+qty; return; }
  p.pri=(Number(p.pri)||0)+qty;
  p.stock=(Number(p.pri)||0)+(Number(p.cie)||0)+(Number(p.vit)||0);
}
// Registra un movimiento de kardex. `extra` (opcional) enriquece: {razon, costo, precio, tc, moneda, almacen}.
// Por defecto guarda una foto del costo del producto en ese momento (para valorizar el kardex).
function recordMov(p,tipo,doc,cant,extra){ DB.movimientos.push(Object.assign({ id:uid(), fecha:new Date().toISOString().slice(0,10), prodId:p.id, codigo:p.codigo, desc:p.desc, tipo, doc, cant, costo:Number(p.costo)||0, moneda:p.moneda||'S/', usuario:usuarioActual() }, extra||{})); }
let emitLock=false;
// Disponible = stock físico menos lo reservado (comprometido) por cotizaciones.
function disponible(p){ return (Number(p.stock)||0) - (Number(p.reservado)||0); }
// Valida que haya stock DISPONIBLE suficiente. Devuelve [] si ok, o lista de faltantes.
function validarStock(lines){
  const need={};
  lines.forEach(l=>{ need[l.prodId]=(need[l.prodId]||0)+Number(l.cant||0); });
  const faltantes=[];
  Object.keys(need).forEach(pid=>{ const p=DB.productos.find(x=>x.id===pid); if(!p) return; const disp=disponible(p); if(need[pid]>disp) faltantes.push(`${p.desc}: pide ${need[pid]}, hay ${disp}`); });
  return faltantes;
}
// Crédito del cliente: deuda pendiente + esta venta no debe superar su línea.
function deudaCliente(clienteId){
  const vv=DB.ventas.filter(v=>v.clienteId===clienteId && esPendienteDoc(v)).reduce((s,v)=>s+docSaldo(v),0);
  const nd=(DB.notasdebito||[]).filter(n=>n.clienteId===clienteId && n.estado==='Pendiente').reduce((s,n)=>s+Number(n.total||0),0);
  // Deuda que ya pasó a letras (canje) sigue contando para el crédito: la factura se canjeó, pero el cliente aún debe.
  const lt=(DB.letras||[]).filter(l=>l.tipo==='cobrar' && l.entidadId===clienteId && l.estado!=='Pagada').reduce((s,l)=>s+Number(l.saldo!=null?l.saldo:l.monto||0),0);
  return vv+nd+lt;
}
function chequeoCredito(clienteId, total){
  const c=DB.clientes.find(x=>x.id===clienteId); if(!c) return {ok:true};
  if(c.bloqueoCredito) return {ok:false, msg:`${c.nombre} tiene el crédito BLOQUEADO. La venta debe ser al contado.`};
  const linea=Number(c.credito)||0;
  if(linea<=0) return {ok:false, msg:`${c.nombre} no tiene línea de crédito. La venta debe ser al contado.`};
  const deuda=deudaCliente(clienteId);
  if(deuda+total > linea) return {ok:false, msg:`Excede el crédito de ${c.nombre}. Línea ${money(linea)}, deuda ${money(deuda)}, esta venta ${money(total)}.`};
  return {ok:true};
}
function snapshotStock(lines){ return lines.map(l=>{ const p=DB.productos.find(x=>x.id===l.prodId); return p?{p,pri:p.pri,cie:p.cie,vit:p.vit,mer:p.mer,stock:p.stock}:null; }).filter(Boolean); }
function restoreStock(snap){ snap.forEach(s=>{ s.p.pri=s.pri; s.p.cie=s.cie; s.p.vit=s.vit; s.p.mer=s.mer; s.p.stock=s.stock; }); }
async function emitirVenta(){
  if(emitLock) return;
  const faltantes=validarStock(venta.lines);
  if(faltantes.length){ toast('Stock insuficiente — '+faltantes.join(' · '),'error'); return; }
  const cli=DB.clientes.find(c=>c.id===venta.clienteId);
  const base=venta.lines.reduce((s,l)=>s+(Number(l.valor)||0)*l.cant,0);
  const igv=base*0.18, total=base+igv;
  if(venta.metodo==='Crédito'){
    const chk=chequeoCredito(venta.clienteId, total);
    if(!chk.ok){ if(!esAdmin()){ toast(chk.msg,'error'); return; } if(!confirm(chk.msg+'\n\n¿Autorizar la venta de todos modos? (queda registrado)')) return; }
  }
  emitLock=true; const btn=document.getElementById('emitBtn'); if(btn) btn.disabled=true;
  let num;
  const lineas = venta.lines.map(l=>{const p=DB.productos.find(x=>x.id===l.prodId);return {prodId:l.prodId,codigo:p.codigo,desc:p.desc,marca:p.marca||'',cant:l.cant,precio:Number(l.valor)||0,costo:costoSoles(p,venta.tc)};});
  try {
    await commit(()=>{
      num = nextNumero(venta.tipo==='Boleta'?'BOLETA':'FACTURA');
      venta.lines.forEach(l=>{const p=DB.productos.find(x=>x.id===l.prodId);deductStock(p,l.cant);recordMov(p,'VENTA',num,-l.cant,{razon:(cli?cli.nombre:'Cliente varios'),precio:Number(l.precio)||0,tc:venta.tc,moneda:venta.moneda||'S/'});});
      DB.ventas.unshift({ id:uid(), num, fecha:new Date().toISOString().slice(0,10), clienteId:venta.clienteId, cliente:cli?cli.nombre:'Cliente varios', items:venta.lines.reduce((s,l)=>s+l.cant,0), subtotal:base, igv, total, estado:venta.metodo==='Crédito'?'Pendiente':'Pagada', saldo:(venta.metodo==='Crédito'?total:0), abonado:(venta.metodo==='Crédito'?0:total), metodo:venta.metodo, tc:venta.tc, referencia:venta.fromCotiz||'', usuario:usuarioActual(), creado:new Date().toISOString(), lineas });
    });
  } catch(e){
    emitLock=false; if(btn) btn.disabled=false;
    toast('No se pudo guardar la venta. No se descontó stock. Reintenta.','error');
    return;
  }
  renderNav();
  toast((venta.tipo||'Venta')+' '+num+' emitida · '+money(total),'success');
  emitLock=false;
  document.querySelector('#segV button[data-t="lista"]').click();
}

/* ================== CUENTAS CORRIENTES — Cobranzas / Pagos ==================
   Registro real de cobros/pagos: abono parcial (a cuenta) por documento, saldo nuevo en
   vivo, medio de pago + banco/cuenta/caja/cobrador, y recibo con historial e impresión.
   CxC y CxP son ESPEJO → un solo motor. El cálculo de dinero está aislado y testeado. */
const R2 = n => Math.round((Number(n)||0)*100)/100;
function docSaldo(d){
  if(!d) return 0;
  if(d.estado==='Anulada') return 0;
  if(d.saldo!=null) return Math.max(0, Number(d.saldo)||0);
  return d.estado==='Pagada' ? 0 : (Number(d.total)||0);   // defensivo con docs previos a la migración v4
}
function esPendienteDoc(d){ return d && d.estado!=='Anulada' && docSaldo(d) > 0.005; }
function estadoPorSaldo(d){ const s=docSaldo(d), t=Number(d.total)||0; return s<=0.005 ? 'Pagada' : (s < t-0.005 ? 'Parcial' : 'Pendiente'); }
/* Aplica abonos a un conjunto de documentos. PURO y testeable.
   aplic = [{docId, abono}] → muta cada doc (saldo, abonado, estado). Devuelve {aplicado, errores}. */
function aplicarAbonos(docs, aplic){
  let aplicado=0; const errores=[];
  (aplic||[]).forEach(a=>{
    const abono=R2(a.abono); if(abono<=0) return;
    const d=(docs||[]).find(x=>x.id===a.docId);
    if(!d){ errores.push('Documento no encontrado'); return; }
    const saldo=docSaldo(d);
    if(abono - saldo > 0.005){ errores.push('El abono de '+abono+' supera el saldo de '+saldo+(d.num?' ('+d.num+')':'')); return; }
    d.abonado=R2((Number(d.abonado)||0)+abono);
    d.saldo=R2(saldo-abono);
    d.estado=estadoPorSaldo(d);
    aplicado=R2(aplicado+abono);
  });
  return { aplicado:R2(aplicado), errores };
}
/* Revierte los abonos de un recibo (al anularlo): devuelve el saldo a cada documento. */
function revertirAbonos(docs, aplicaciones){
  (aplicaciones||[]).forEach(a=>{
    const d=(docs||[]).find(x=>x.id===a.docId); if(!d) return;
    const prev=docSaldo(d);
    d.abonado=Math.max(0, R2((Number(d.abonado)||0)-Number(a.abono||0)));
    d.saldo=R2(prev+Number(a.abono||0));
    if(d.estado!=='Anulada') d.estado=estadoPorSaldo(d);
  });
}

// Totales de compra (PURO/testeable). El costo de línea es la base (sin IGV, porque el IGV de
// compras es crédito fiscal recuperable → no entra al costo del inventario). Con IGV suma el 18%.
function compraTotales(lines, igvRate, conIGV){
  const R=n=>Math.round((Number(n)||0)*100)/100;
  const subtotal=R((lines||[]).reduce((s,l)=>s+(Number(l.costo)||0)*(Number(l.cant)||0),0));
  const igv = conIGV ? R(subtotal*(Number(igvRate)||0)) : 0;
  return { subtotal, igv, total:R(subtotal+igv) };
}

function compraTraerOC(){
  const ocs=DB.ordenescompra.filter(o=>o.estado!=='Recibida' && o.proveedor===compra.proveedor);
  if(!ocs.length){ toast('No hay órdenes de compra pendientes de '+(compra.proveedor||'ese proveedor'),'error'); return; }
  openModal('Traer de Orden de Compra', `<div class="form-grid"><div class="field full"><label>Orden de compra pendiente</label><select id="ocPick">${ocs.map(o=>`<option value="${o.id}">${o.num} · ${money(o.total)} · ${o.items} ítems</option>`).join('')}</select></div></div>`, ()=>{
    const o=DB.ordenescompra.find(x=>x.id===val('ocPick')); if(!o){toast('Selecciona una OC','error');return false;}
    (o.lineas||[]).forEach(l=>{ if(l.prodId){ const ex=compra.lines.find(x=>x.prodId===l.prodId); if(ex) ex.cant+=Number(l.cant)||1; else compra.lines.push({prodId:l.prodId,cant:Number(l.cant)||1,costo:Number(l.costo)||0}); } });
    compra.ocNum=o.num; drawCompra(); toast('Líneas traídas de '+o.num,'success'); return true;
  });
}
async function emitirCompra(){
  if(emitLock) return;
  if(!compra.lines.length){ toast('Agrega al menos un producto','error'); return; }
  emitLock=true; const btn=document.getElementById('emitCompra'); if(btn) btn.disabled=true;
  const t=compraTotales(compra.lines, compra.igvRate, compra.conIGV);
  const numProv = (compra.serie||compra.numero) ? ((compra.serie?compra.serie:'')+(compra.serie&&compra.numero?'-':'')+(compra.numero||'')) : '';
  let num;
  try {
    await commit(()=>{
      num = nextNumero('COMPRA');
      compra.lines.forEach(l=>{const p=DB.productos.find(x=>x.id===l.prodId);
        const stockPrev=Number(p.stock)||0, costoPrev=Number(p.costo)||0;
        addStock(p,l.cant);
        // Costo promedio ponderado sobre la BASE (sin IGV). Si no había costo, lo establece esta compra.
        p.costo = (costoPrev>0 && stockPrev>0) ? (stockPrev*costoPrev + l.cant*Number(l.costo)) / (stockPrev+l.cant) : Number(l.costo)||0;
        recordMov(p,'COMPRA',numProv||num,l.cant,{razon:compra.proveedor,costo:Number(l.costo)||Number(p.costo)||0,tc:compra.tc,moneda:compra.moneda||'S/'});});
      DB.compras.unshift({ id:uid(), num, numProv, tipoDoc:compra.tipoDoc, distrito:compra.distrito, fecha:compra.emision||new Date().toISOString().slice(0,10),
        ingreso:compra.ingreso, vcto:compra.vcto, periodo:compra.periodo, guia:compra.guia, moneda:compra.moneda, tc:compra.tc,
        proveedor:compra.proveedor, items:compra.lines.reduce((s,l)=>s+l.cant,0), subtotal:t.subtotal, igv:t.igv, total:t.total,
        estado:compra.metodo==='Crédito'?'Pendiente':'Pagada', saldo:(compra.metodo==='Crédito'?t.total:0), abonado:(compra.metodo==='Crédito'?0:t.total),
        metodo:compra.metodo, ocNum:compra.ocNum||'', usuario:usuarioActual(), creado:new Date().toISOString() });
    });
  } catch(e){ emitLock=false; if(btn) btn.disabled=false; toast('No se pudo guardar la compra. Reintenta.','error'); return; }
  renderNav();
  toast('Compra '+num+(numProv?(' ('+numProv+')'):'')+' registrada · stock y costo actualizados','success');
  emitLock=false;
  document.querySelector('#segC button[data-t="lista"]').click();
}

function numeroALetras(n){
  n=Math.floor(Math.abs(Number(n)||0));
  const U=['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISEIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE'];
  const D=['','','','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
  const C=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
  function sec(x){ if(x===0)return ''; if(x===100)return 'CIEN'; let t=''; const c=Math.floor(x/100), dd=x%100, d=Math.floor(dd/10), u=dd%10; if(c)t+=C[c]+' '; if(dd<=20)t+=U[dd]; else if(dd<30)t+='VEINTI'+U[u]; else {t+=D[d]; if(u)t+=' Y '+U[u];} return t.trim(); }
  if(n===0)return 'CERO';
  const mill=Math.floor(n/1000000), miles=Math.floor((n%1000000)/1000), resto=n%1000; let p='';
  if(mill)p+=(mill===1?'UN MILLON':sec(mill)+' MILLONES')+' ';
  if(miles)p+=(miles===1?'MIL':sec(miles)+' MIL')+' ';
  if(resto)p+=sec(resto);
  return p.trim();
}
function montoEnLetras(total,moneda){
  const ent=Math.floor(total), cent=Math.round((total-ent)*100);
  const mon = (moneda==='US$'||moneda==='$') ? 'DOLARES AMERICANOS' : 'SOLES';
  return numeroALetras(ent)+' CON '+String(cent).padStart(2,'0')+'/100 '+mon;
}

function reservarCotiz(id){
  const c=DB.cotizaciones.find(x=>x.id===id); if(!c) return;
  const faltantes=[];
  (c.lineas||[]).forEach(l=>{ if(l.prodId){ const p=DB.productos.find(x=>x.id===l.prodId); if(p && l.cant>disponible(p)) faltantes.push(`${p.desc}: disp ${disponible(p)}`); } });
  if(faltantes.length){ toast('Sin stock disponible para reservar — '+faltantes.join(' · '),'error'); return; }
  commit(()=>{ (c.lineas||[]).forEach(l=>{ if(l.prodId){ const p=DB.productos.find(x=>x.id===l.prodId); if(p) p.reservado=(Number(p.reservado)||0)+l.cant; } }); const cc=DB.cotizaciones.find(x=>x.id===id); cc.estado='Reservada'; })
    .then(()=>{ toast('Stock reservado para '+c.num,'success'); renderCotizLista(); renderNav(); }).catch(()=>toast('No se pudo reservar','error'));
}
function liberarCotiz(id){
  const c=DB.cotizaciones.find(x=>x.id===id); if(!c||c.estado!=='Reservada') return;
  commit(()=>{ (c.lineas||[]).forEach(l=>{ if(l.prodId){ const p=DB.productos.find(x=>x.id===l.prodId); if(p) p.reservado=Math.max(0,(Number(p.reservado)||0)-l.cant); } }); const cc=DB.cotizaciones.find(x=>x.id===id); cc.estado='Vigente'; })
    .then(()=>{ toast('Reserva liberada','success'); renderCotizLista(); renderNav(); }).catch(()=>toast('No se pudo liberar','error'));
}

  si.onkeydown=(e)=>{
    if(!results.length) return;
    const refoc=()=>{ const el=document.getElementById('cotizSearch'); if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);} };
    if(e.key==='ArrowDown'){ e.preventDefault(); cotiz.hl=Math.min((cotiz.hl||0)+1, results.length-1); drawCotiz(); refoc(); return; }

    if(e.key==='Enter'){ e.preventDefault(); const id=results[cotiz.hl||0].id, ex=cotiz.lines.find(l=>l.prodId===id); if(ex)ex.cant++; else {const p=DB.productos.find(x=>x.id===id);cotiz.lines.push({prodId:id,cant:1,valor:cotizValor(p),edited:false});} cotiz.search=''; cotiz.hl=0; drawCotiz(); }

  b.querySelectorAll('[data-val]').forEach(inp=>inp.onchange=()=>{cotiz.lines[inp.dataset.val].valor=parseFloat(inp.value)||0;cotiz.lines[inp.dataset.val].edited=true;drawCotiz();});
  b.querySelectorAll('[data-rm]').forEach(x=>x.onclick=()=>{cotiz.lines.splice(x.dataset.rm,1);drawCotiz();});
  const emit=document.getElementById('emitCotiz'); if(emit&&cotiz.lines.length)emit.onclick=emitirCotiz;
}
async function emitirCotiz(){
  if(emitLock) return; emitLock=true; const btn=document.getElementById('emitCotiz'); if(btn) btn.disabled=true;
  const cli=DB.clientes.find(c=>c.id===cotiz.clienteId)||{};
  const lineas=cotiz.lines.map(l=>{const p=DB.productos.find(x=>x.id===l.prodId);return {prodId:l.prodId,codigo:p.codigo,desc:p.desc,marca:p.marca||'',cant:l.cant,valor:Number(l.valor)||0};});
  const sub=lineas.reduce((s,l)=>s+l.valor*l.cant,0);
  const dsctoMonto=sub*(Number(cotiz.descuento)||0)/100;
  const total=(sub-dsctoMonto)*1.18;
  const editing = cotiz.editingId ? DB.cotizaciones.find(x=>x.id===cotiz.editingId) : null;
  const doc={ id: editing?editing.id:uid(), num: editing?editing.num:null, fecha: editing?editing.fecha:new Date().toISOString().slice(0,10), clienteId:cotiz.clienteId, cliente:cli.nombre||'—', moneda:cotiz.moneda, tc:cotiz.tc, descuento:dsctoMonto, descuentoPct:Number(cotiz.descuento)||0, atencion:cotiz.atencion, vendedor:cotiz.vendedor, referencia:cotiz.referencia, vigencia:cotiz.vigencia, nota:cotiz.nota, items:cotiz.lines.reduce((s,l)=>s+l.cant,0), total, estado: editing?editing.estado:'Vigente', usuario:usuarioActual(), lineas };
  try {
    await commit(()=>{
      if(!editing) doc.num = nextNumero('COTIZACION');
      if(editing){ const idx=DB.cotizaciones.findIndex(x=>x.id===editing.id); DB.cotizaciones[idx]=doc; } else { DB.cotizaciones.unshift(doc); }
    });
  } catch(e){ emitLock=false; if(btn) btn.disabled=false; toast('No se pudo guardar la cotización. Reintenta.','error'); return; }
  renderNav();
  printCotiz(doc);
  toast('Cotización '+doc.num+(editing?' actualizada':' generada'),'success');
  emitLock=false;
  document.querySelector('#segCot button[data-t="lista"]').click();
}
function printCotiz(c){ const cli=DB.clientes.find(x=>x.id===c.clienteId)||{nombre:c.cliente}; printDocumento({ tipo:'COTIZACION', numero:c.num, cliente:cli, fecha:c.fecha, moneda:c.moneda, tc:c.tc, descuento:c.descuento, atencion:c.atencion, vendedor:c.vendedor, vigencia:c.vigencia, referencia:c.referencia, nota:c.nota, lineas:c.lineas }); }
function whatsappCotiz(c){
  if(!c) return;
  const cli=DB.clientes.find(x=>x.id===c.clienteId)||{};
  let tel=(cli.tel||'').replace(/[^0-9]/g,''); if(tel.length===9) tel='51'+tel; // Perú
  const sym=c.moneda==='US$'?'US$':'S/';
  let msg=`*JL REPUESTOS* — Cotización ${c.num}\n`;
  if(cli.nombre) msg+=`Cliente: ${cli.nombre}\n`;
  msg+='\n';
  (c.lineas||[]).forEach(l=>{ msg+=`• ${l.cant} x ${l.desc} — ${sym} ${(Number(l.valor)*l.cant).toFixed(2)}\n`; });
  msg+=`\n*TOTAL: ${sym} ${(Number(c.total)||0).toFixed(2)}*`;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
}
function cotizAFactura(id){
  const c=DB.cotizaciones.find(x=>x.id===id); if(!c) return;
  confirmDialog('¿Convertir en factura?','Se generará una factura con estos productos y se descontará el stock.',async ()=>{
    if(emitLock) return;
    const tc=Number(c.tc)||tcActual();
    const lineas=(c.lineas||[]).map(l=>{ const soles=c.moneda==='US$'?(Number(l.valor)||0)*tc:(Number(l.valor)||0); const p=DB.productos.find(x=>x.id===l.prodId); return {prodId:l.prodId,codigo:l.codigo,desc:l.desc,marca:l.marca||'',cant:l.cant,precio:soles,costo:p?costoSoles(p,tc):0}; });
    const conProd=lineas.filter(l=>l.prodId && DB.productos.some(p=>p.id===l.prodId));
    const reservada = c.estado==='Reservada';   // esta cotización tiene su propio stock reservado
    // Valida contra el disponible, sumando lo que esta misma cotización tenía reservado (se liberará al facturar).
    const faltantes=[];
    conProd.forEach(l=>{ const p=DB.productos.find(x=>x.id===l.prodId); const avail=disponible(p)+(reservada?l.cant:0); if(l.cant>avail) faltantes.push(`${p.desc}: disp ${avail}`); });
    if(faltantes.length){ toast('Stock insuficiente — '+faltantes.join(' · '),'error'); return; }
    emitLock=true;
    const base=lineas.reduce((s,l)=>s+l.precio*l.cant,0), igv=base*0.18, total=base+igv;
    let num;
    try {
      await commit(()=>{
        num = nextNumero('FACTURA');
        conProd.forEach(l=>{ const p=DB.productos.find(x=>x.id===l.prodId); if(reservada) p.reservado=Math.max(0,(Number(p.reservado)||0)-l.cant); deductStock(p,l.cant); recordMov(p,'VENTA',num,-l.cant,{razon:c.cliente,precio:Number(l.precio)||0,tc,moneda:c.moneda||'S/'}); });
        const cc=DB.cotizaciones.find(x=>x.id===c.id); if(cc) cc.estado='Facturada';
        DB.ventas.unshift({ id:uid(), num, fecha:new Date().toISOString().slice(0,10), clienteId:c.clienteId, cliente:c.cliente, items:lineas.reduce((s,l)=>s+l.cant,0), subtotal:base, igv, total, estado:'Pagada', saldo:0, abonado:total, metodo:'Contado', tc, referencia:c.num, usuario:usuarioActual(), creado:new Date().toISOString(), lineas });
      });
    } catch(e){ emitLock=false; toast('No se pudo guardar. No se descontó stock. Reintenta.','error'); return; }
    renderNav();
    toast('Factura '+num+' creada desde '+c.num,'success');
    emitLock=false;
    go('ventas');
  });
}

/* ---------- KARDEX ---------- */
let kardexId=null, kxDesde='', kxHasta='', kxOper='TODOS', kxRazon='';
// Saldo corrido del kardex (PURO): a partir del stock ACTUAL reconstruye el saldo tras cada
// movimiento. saldoBase = stock − suma(movimientos) = existencia antes del primer movimiento.
function kardexCorrido(movs, stockActual){
  const net=(movs||[]).reduce((s,m)=>s+Number(m.cant||0),0);
  const saldoBase=(Number(stockActual)||0)-net;
  let saldo=saldoBase, ingresos=0, salidas=0; const filas=[];
  (movs||[]).forEach(m=>{ const antes=saldo, cant=Number(m.cant||0); saldo+=cant;
    if(cant>0) ingresos+=cant; else salidas+=-cant;
    filas.push({ m, antes, saldo }); });
  return { saldoBase, saldoFinal:saldo, ingresos, salidas, filas };
}
function kxStat(label,color,value){ return `<div style="flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:12px 14px"><div style="font-size:10.5px;color:var(--ink-3);letter-spacing:.5px;text-transform:uppercase">${label}</div><div style="font-size:20px;font-weight:800;color:${color}">${value}</div></div>`; }
function tipoBadge(t){ return t==='COMPRA'?'<span class="badge badge-green">COMPRA</span>':t==='VENTA'?'<span class="badge badge-red">VENTA</span>':`<span class="badge badge-gray">${t}</span>`; }
VIEWS.kardex=(el)=>{
  el.innerHTML=`<div class="page-head"><div><h1>Kardex</h1><p>Movimientos de entrada y salida por producto</p></div></div>
    <div class="card" style="margin-bottom:20px"><div style="padding:16px;position:relative">
      <div class="search" style="width:100%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="kxSearch" placeholder="Buscar producto por código o nombre..." autocomplete="off"></div>
      <div id="kxResults" class="global-results" style="left:16px;right:16px"></div>
    </div></div><div id="kxBody"></div>`;
  const si=document.getElementById('kxSearch'), box=document.getElementById('kxResults');
  si.oninput=()=>{ const q=si.value.toLowerCase().trim(); if(!q){box.classList.remove('open');return;}
    const res=buscarProductos(si.value,8);
    box.innerHTML=res.map(p=>`<div class="gr-item" data-k="${p.id}"><div><div class="cell-strong">${p.desc}</div><div class="cell-mono" style="color:var(--ink-3);font-size:11.5px">${p.codigo} · stock ${p.stock}</div></div></div>`).join('')||'<div style="padding:16px;color:var(--ink-3)">Sin resultados</div>';
    box.classList.add('open');
    box.querySelectorAll('[data-k]').forEach(r=>r.onclick=()=>{kardexId=r.dataset.k;box.classList.remove('open');si.value='';renderKardex();});

  if(kardexId) renderKardex();

function renderKardex(){
  const b=document.getElementById('kxBody'); const p=DB.productos.find(x=>x.id===kardexId); if(!p){b.innerHTML='';return;}
  const all=DB.movimientos.filter(m=>m.prodId===kardexId);
  const kc=kardexCorrido(all, p.stock);
  const enRango=m=>(!kxDesde||String(m.fecha)>=kxDesde)&&(!kxHasta||String(m.fecha)<=kxHasta);
  const operMatch=m=>kxOper==='TODOS'||m.tipo===kxOper;
  const razonMatch=m=>!kxRazon||String(m.razon||'').toLowerCase().includes(kxRazon.toLowerCase());
  // Aplicar filtros conservando el saldo corrido global:
  let inicial=null, ing=0, sal=0, valor=0; const filas=[];
  kc.filas.forEach(f=>{ const m=f.m; if(enRango(m)&&operMatch(m)&&razonMatch(m)){
    if(inicial===null) inicial=f.antes; const cant=Number(m.cant||0);
    if(cant>0) ing+=cant; else sal+=-cant;
    const costo=Number(m.costo!=null?m.costo:p.costo)||0; valor+=Math.abs(cant)*costo;
    filas.push({...f, costo}); } });
  if(inicial===null) inicial=kc.saldoBase;
  const final=filas.length?filas[filas.length-1].saldo:inicial;
  const tipos=[...new Set(all.map(m=>m.tipo))];
  const activo=(kxDesde||kxHasta||kxOper!=='TODOS'||kxRazon);
  b.innerHTML=`<div class="card">
    <div style="padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <div><div style="font-size:16px;font-weight:700">${p.desc}</div><div class="cell-mono" style="color:var(--brand);margin-top:2px">${p.codigo}${p.codFab?' ↔ '+p.codFab:''}${p.um?' · '+p.um:''}</div></div>
      <div style="display:flex;align-items:center;gap:18px">
        <button class="btn btn-ghost btn-sm" id="kxPrint">${ICN.print} Imprimir</button>
        <div style="text-align:right"><div style="font-size:11px;color:var(--ink-3);letter-spacing:.5px">STOCK ACTUAL</div><div style="font-size:26px;font-weight:800">${p.stock}</div></div>
      </div>
    </div>
    <div style="padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div class="field" style="margin:0"><label>Desde</label><input type="date" id="kxDesde" value="${kxDesde}"></div>
      <div class="field" style="margin:0"><label>Hasta</label><input type="date" id="kxHasta" value="${kxHasta}"></div>
      <div class="field" style="margin:0"><label>Operación</label><select id="kxOper"><option value="TODOS">Todas</option>${tipos.map(t=>`<option value="${t}" ${kxOper===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field" style="margin:0;min-width:200px"><label>Razón social</label><input id="kxRazon" value="${(kxRazon||'').replace(/"/g,'&quot;')}" placeholder="Cliente / proveedor"></div>
      ${activo?`<button class="btn btn-ghost btn-sm" id="kxClear">Limpiar filtros</button>`:''}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)">
      ${kxStat('Saldo inicial','var(--ink-2)',inicial)}
      ${kxStat('Ingresos','var(--green)','+'+ing)}
      ${kxStat('Salidas','var(--red)','−'+sal)}
      ${kxStat('Saldo final','var(--brand)',final)}
      ${kxStat('Valor movido (costo)','var(--purple)',money(valor))}
    </div>
    <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Operación</th><th>Razón social</th><th>Documento</th><th style="text-align:right">Costo</th><th style="text-align:center">Ingreso</th><th style="text-align:center">Salida</th><th style="text-align:center">Saldo</th></tr></thead><tbody>
    ${filas.map(f=>{const m=f.m,cant=Number(m.cant||0);return `<tr><td>${fmtDate(m.fecha)}</td><td>${tipoBadge(m.tipo)}</td><td>${m.razon||'—'}</td><td class="cell-mono">${m.doc||''}</td><td style="text-align:right" class="cell-mono">${f.costo?money2(f.costo,m.moneda||p.moneda):'—'}</td><td style="text-align:center;color:var(--green);font-weight:700">${cant>0?cant:''}</td><td style="text-align:center;color:var(--red);font-weight:700">${cant<0?-cant:''}</td><td style="text-align:center" class="cell-strong">${f.saldo}</td></tr>`;}).join('')||`<tr><td colspan="8" class="empty" style="padding:40px">Sin movimientos ${activo?'en el filtro':'registrados aún'}.<br><span style="font-size:12px;color:var(--ink-3)">Se generan automáticamente al vender, comprar, importar y ajustar.</span></td></tr>`}
    </tbody></table></div></div>`;
  const bind=(id,ev,fn)=>{const e=document.getElementById(id);if(e)e[ev]=fn;};
  bind('kxDesde','onchange',e=>{kxDesde=e.target.value;renderKardex();});
  bind('kxHasta','onchange',e=>{kxHasta=e.target.value;renderKardex();});
  bind('kxOper','onchange',e=>{kxOper=e.target.value;renderKardex();});
  bind('kxRazon','onchange',e=>{kxRazon=e.target.value;renderKardex();});
  bind('kxClear','onclick',()=>{kxDesde='';kxHasta='';kxOper='TODOS';kxRazon='';renderKardex();});
  bind('kxPrint','onclick',()=>printKardex(p, filas, {inicial,ing,sal,final,valor}));
}
function printKardex(p, filas, t){
  const w=window.open('','_blank','width=900,height=1000'); if(!w){toast('Permite las ventanas emergentes','error');return;}

  const si=document.getElementById('ajSearch'), box=document.getElementById('ajResults');

    const res=buscarProductos(si.value,8);

function renderAjuste(){
  const b=document.getElementById('ajBody'); const p=DB.productos.find(x=>x.id===ajusteId); if(!p){b.innerHTML='';return;}
  b.innerHTML=`<div style="padding:20px;border-top:1px solid var(--line)">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px">
      <div><div style="font-size:16px;font-weight:700">${p.desc}</div><div class="cell-mono" style="color:var(--brand)">${p.codigo}</div></div>
      <div style="text-align:right"><div style="font-size:11px;color:var(--ink-3)">STOCK ACTUAL</div><div style="font-size:24px;font-weight:800">${p.stock}</div></div>
    </div>
    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
      <div class="field" style="width:160px"><label>Nuevo stock físico</label><input id="ajNuevo" type="number" value="${p.stock}"/></div>
      <div class="field" style="flex:1;min-width:200px"><label>Motivo</label><input id="ajMotivo" placeholder="Conteo físico, merma, corrección..."/></div>
      <button class="btn btn-primary" id="ajAplicar">${ICN.check} Aplicar ajuste</button>
    </div></div>`;
  document.getElementById('ajAplicar').onclick=()=>{
    const nuevo=parseInt(document.getElementById('ajNuevo').value); if(isNaN(nuevo)){toast('Ingresa un número','error');return;}
    const diff=nuevo-Number(p.stock); if(diff===0){toast('No hay cambios','error');return;}
    if(p.pri===undefined) p.pri=Number(p.stock)||0;
    p.pri=Math.max(0,(Number(p.pri)||0)+diff);
    p.stock=(Number(p.pri)||0)+(Number(p.cie)||0)+(Number(p.vit)||0);
    recordMov(p,'AJUSTE',document.getElementById('ajMotivo').value||'Ajuste manual',diff);
    save(); renderNav(); toast('Stock ajustado ('+(diff>0?'+':'')+diff+')','success'); go('ajuste'); ajusteId=p.id; renderAjuste();
  };
}

    </div></div>`;
  document.getElementById('ncVenta').onchange=(e)=>{ const v=DB.ventas.find(x=>x.id===e.target.value); nc.ventaId=e.target.value; nc.lines=v?(v.lineas||[]).map(l=>({prodId:l.prodId,codigo:l.codigo,desc:l.desc,marca:l.marca||'',precio:Number(l.precio)||0,cant:Number(l.cant)||0,maxCant:Number(l.cant)||0})):[]; drawNC(); };

  document.getElementById('ncObs').onchange=(e)=>nc.observacion=e.target.value;
  b.querySelectorAll('[data-ncq]').forEach(inp=>inp.onchange=()=>{const l=nc.lines[inp.dataset.ncq];let v=parseInt(inp.value)||0;if(v<0)v=0;if(v>l.maxCant)v=l.maxCant;l.cant=v;drawNC();});
  const g=document.getElementById('ncGrabar'); if(g && nc.lines.some(l=>l.cant>0)) g.onclick=grabarNC;
}
async function grabarNC(){
  const v=DB.ventas.find(x=>x.id===nc.ventaId); if(!v) return;
  const lineas=nc.lines.filter(l=>l.cant>0).map(l=>({prodId:l.prodId,codigo:l.codigo,desc:l.desc,marca:l.marca||'',cant:l.cant,precio:l.precio}));
  if(!lineas.length){ toast('Indica al menos una cantidad a acreditar','error'); return; }
  if(emitLock) return; emitLock=true; const btn=document.getElementById('ncGrabar'); if(btn) btn.disabled=true;
  const base=lineas.reduce((s,l)=>s+l.precio*l.cant,0), igv=base*0.18, total=base+igv;
  const doc={ id:uid(), num:null, ventaNum:v.num, fecha:new Date().toISOString().slice(0,10), clienteId:v.clienteId, cliente:v.cliente, motivo:nc.motivo, observacion:nc.observacion, moneda:'S/', tc:nc.tc, subtotal:base, igv, total, usuario:usuarioActual(), creado:new Date().toISOString(), lineas };
  try {
    await commit(()=>{
      doc.num = nextNumero('NOTA_CREDITO');
      lineas.forEach(l=>{ if(l.prodId){ const p=DB.productos.find(x=>x.id===l.prodId); if(p){ addStock(p,l.cant); recordMov(p,'AJUSTE','N.Crédito '+v.num,l.cant); } } });
      const totalDevuelto=lineas.reduce((s,l)=>s+l.cant,0), totalVendido=(v.lineas||[]).reduce((s,l)=>s+l.cant,0);
      if(nc.motivo==='Anulación de operación' || totalDevuelto>=totalVendido){ const vv=DB.ventas.find(x=>x.id===v.id); if(vv) vv.estado='Anulada'; }
      DB.notascredito.unshift(doc);
    });
  } catch(e){ emitLock=false; if(btn) btn.disabled=false; toast('No se pudo guardar la N. Crédito. Reintenta.','error'); return; }
  renderNav();
  printNC(doc);
  toast('Nota de crédito '+doc.num+' grabada · stock repuesto','success');
  emitLock=false;
  document.querySelector('#segNC button[data-t="lista"]').click();
}
function printNC(n){ const cli=DB.clientes.find(c=>c.id===n.clienteId)||{nombre:n.cliente}; printDocumento({ tipo:'NOTA DE CREDITO', numero:n.num, cliente:cli, fecha:n.fecha, moneda:'S/', tc:n.tc||3.6, referencia:'Doc. rel.: '+n.ventaNum, nota:'Motivo: '+(n.motivo||'')+(n.observacion?' — '+n.observacion:''), lineas:(n.lineas||[]).map(l=>({desc:l.desc,marca:l.marca||'',cant:l.cant,valor:l.precio})) }); }

/* ---------- IMPORTACIÓN (costo aterrizado / landed cost) ---------- */
function convMoneda(monto, from, to, tc){ monto=Number(monto)||0; if(from===to) return monto; if(from==='$'&&to==='S/') return monto*(Number(tc)||tcActual()); if(from==='S/'&&to==='$') return monto/(Number(tc)||tcActual()); return monto; }
// Prorratea los costos (flete+seguro+aduana+otros) entre las líneas según su valor FOB.
// Devuelve cada línea con: importeFob, prorrateo, landedUnit (costo aterrizado unitario), landedTotal.
function landedCost(lineas, costos){
  const fobTotal = lineas.reduce((s,l)=>s+(Number(l.fob)||0)*(Number(l.cant)||0),0);
  const extra = (Number(costos.flete)||0)+(Number(costos.seguro)||0)+(Number(costos.aduana)||0)+(Number(costos.otros)||0);
  return lineas.map(l=>{
    const cant=Number(l.cant)||0, importeFob=(Number(l.fob)||0)*cant;
    const prorrateo = fobTotal>0 ? extra*(importeFob/fobTotal) : (lineas.length?extra/lineas.length:0);
    const landedTotal = importeFob+prorrateo;
    const landedUnit = cant>0 ? landedTotal/cant : (Number(l.fob)||0);
    return Object.assign({}, l, { importeFob, prorrateo, landedTotal, landedUnit });
  });
}

/* ---------- LETRAS (cobrar / pagar a plazo) ---------- */
let letrasTipo='cobrar';
function addMonths(dateStr, m){ const parts=String(dateStr||'').split('-').map(Number); const d=new Date(parts[0], (parts[1]-1)+m, parts[2]||1); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function letraSaldo(l){ if(!l) return 0; if(l.estado==='Pagada') return 0; return Number(l.saldo!=null?l.saldo:l.monto)||0; }
function letraEstado(l){ if(l.estado==='Pagada' || letraSaldo(l)<=0.005) return 'Pagada'; const hoy=new Date().toISOString().slice(0,10); if(l.fechaVencimiento && l.fechaVencimiento<hoy) return 'Vencida'; return l.estado==='Parcial'?'Parcial':'Pendiente'; }
// Genera N letras que suman EXACTAMENTE el total; la última ajusta el redondeo. Vencimientos mensuales.
function generarLetras(montoTotal, n, venc0){
  n=Math.max(1,Math.floor(n)); montoTotal=Number(montoTotal)||0;
  const cuota=Math.round(montoTotal/n*100)/100, out=[];
  for(let i=0;i<n;i++){ const monto = i===n-1 ? Math.round((montoTotal-cuota*(n-1))*100)/100 : cuota; out.push({ monto, fechaVencimiento: addMonths(venc0, i) }); }
  return out;
}
/* Canje de facturas → letras (Letras de Compra/Venta). PURO y testeable.
   Toma los documentos seleccionados (ventas o compras), transfiere su saldo a N letras
   (que suman EXACTAMENTE el total) y marca cada factura como 'Canjeada' (saldo 0 → sale de CxC/CxP).
   El total NO se pierde: pasa de "facturas por pagar/cobrar" a "letras". */
function canjearDocs(docs, ids, n, venc0, meta){
  const sel=(docs||[]).filter(d=>ids.includes(d.id) && esPendienteDoc(d));
  const total=R2(sel.reduce((s,d)=>s+docSaldo(d),0));
  if(!sel.length || total<=0) return { total:0, letras:[], canjeadas:[] };
  const cuotas=generarLetras(total, n, venc0);
  sel.forEach(d=>{ d.canjeadaLetra=meta.grupo; d.saldo=0; d.estado='Canjeada'; });
  const docRef=sel.map(d=>d.num).join(', ');
  const letras=cuotas.map((q,i)=>({
    id:uid(), num:(n>1?meta.base+'-'+(i+1)+'/'+n:meta.base), tipo:meta.tipo, grupo:meta.grupo,

// Pago (o cobro) de una letra, con abono parcial. Actualiza saldo/estado de la letra.
function pagarLetra(id){
  const l=DB.letras.find(z=>z.id===id); if(!l) return;
  const saldo=letraSaldo(l);
  openModal((letrasTipo==='cobrar'?'Cobrar':'Pagar')+' letra '+l.num, `<div class="form-grid">
    <div class="field"><label>Saldo actual</label><input value="${money(saldo)}" disabled></div>
    <div class="field"><label>Monto a ${letrasTipo==='cobrar'?'cobrar':'pagar'} <span class="req">*</span></label><input id="pl_monto" type="number" step="0.01" min="0" value="${saldo}"></div>
    <div class="field"><label>Fecha</label><input id="pl_fecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Banco / operación</label><input id="pl_banco" value="${l.banco||''}" placeholder="Opcional"></div>
  </div>`, ()=>{
    let abono=Number(val('pl_monto'))||0; if(abono<=0){toast('Ingresa un monto','error');return false;}
    if(abono>saldo+0.005) abono=saldo;
    commit(()=>{ const z=DB.letras.find(y=>y.id===id); const nuevo=R2(letraSaldo(z)-abono);
      z.saldo=nuevo; z.abonado=R2((Number(z.abonado)||0)+abono); z.banco=val('pl_banco')||z.banco;
      z.estado=nuevo<=0.005?'Pagada':'Parcial'; if(nuevo<=0.005) z.fechaPago=val('pl_fecha')||new Date().toISOString().slice(0,10);
    }).then(()=>{ renderLetras(); toast('Letra '+l.num+' — '+money(abono)+(letrasTipo==='cobrar'?' cobrado':' pagado'),'success'); }).catch(()=>toast('No se pudo registrar','error'));
    return true;
  });
}
// Anula un canje: restaura el saldo de las facturas canjeadas y elimina las letras del grupo.
function revertirCanje(grupo){
  const letras=DB.letras.filter(l=>l.grupo===grupo);
  const ids=new Set(); letras.forEach(l=>(l.docIds||[]).forEach(id=>ids.add(id)));
  const docs=[...DB.ventas, ...DB.compras];
  ids.forEach(id=>{ const d=docs.find(x=>x.id===id); if(d && d.estado==='Canjeada'){ d.saldo=R2(Number(d.total||0)-Number(d.abonado||0)); delete d.canjeadaLetra; d.estado=estadoPorSaldo(d); } });
  DB.letras=DB.letras.filter(l=>l.grupo!==grupo);
}

/* ---------- UNIÓN DE CÓDIGO (fusionar duplicados) ---------- */
let unionSel={origen:null,destino:null};
function unirCodigos(origen, destino){
  // Suma el stock del origen al destino (por almacén), reasigna movimientos y elimina el origen.
  ['pri','cie','vit','mer'].forEach(k=>{ if(origen[k]!==undefined||destino[k]!==undefined) destino[k]=(Number(destino[k])||0)+(Number(origen[k])||0); });
  destino.stock=(Number(destino.pri)||0)+(Number(destino.cie)||0)+(Number(destino.vit)||0);
  if(destino.pri===undefined && destino.cie===undefined) destino.stock=(Number(destino.stock)||0)+(Number(origen.stock)||0);

}

// Agrega utilidad por producto sobre las ventas no anuladas. Usa el costo snapshot de cada línea.
function agregarRentabilidad(){
  let ventaTotal=0, costoTotal=0; const porProd={};
  DB.ventas.filter(v=>v.estado!=='Anulada').forEach(v=>{
    (v.lineas||[]).forEach(l=>{
      const ingreso=(Number(l.precio)||0)*l.cant, costo=(Number(l.costo)||0)*l.cant;
      ventaTotal+=ingreso; costoTotal+=costo;
      const k=l.codigo||l.desc; if(!porProd[k])porProd[k]={desc:l.desc,codigo:l.codigo,ingreso:0,costo:0,cant:0};
      porProd[k].ingreso+=ingreso; porProd[k].costo+=costo; porProd[k].cant+=l.cant;
    });
  });
  return { ventaTotal, costoTotal, utilidad:ventaTotal-costoTotal, margen: ventaTotal>0?((ventaTotal-costoTotal)/ventaTotal*100):0, porProd };
}

function val(id){return document.getElementById(id).value.trim();}
function fmtDate(d){ if(!d)return '—'; const p=d.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function estadoBadge(e){ return e==='Pagada'?'<span class="badge badge-green">Pagada</span>':e==='Pendiente'?'<span class="badge badge-amber">Pendiente</span>':`<span class="badge badge-gray">${e}</span>`; }
function emptyRow(c){return `<tr><td colspan="${c}" class="empty" style="padding:40px">Sin registros</td></tr>`;}
function emptyState(t,s){return `<div class="empty">${ICN.box}<h3>${t}</h3><p>${s}</p></div>`;}

function openModal(title, bodyHTML, onSave){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" id="mClose">${ICN.x}</button></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">${ICN.check} Guardar</button></div></div>`;
  m.classList.add('open');
  const close=()=>m.classList.remove('open');
  document.getElementById('mClose').onclick=close;
  document.getElementById('mCancel').onclick=close;
  document.getElementById('mSave').onclick=()=>{ if(onSave()!==false) close(); };
  m.onclick=(e)=>{ if(e.target===m) close(); };
  setTimeout(()=>m.querySelector('input')?.focus(),50);
}
function confirmDialog(title,msg,onYes){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal" style="max-width:420px"><div class="modal-head"><h2>${title}</h2></div>
    <div class="modal-body"><p style="color:var(--ink-2)">${msg||'¿Estás seguro?'}</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="cCancel">Cancelar</button><button class="btn btn-danger" id="cYes">${ICN.del} Eliminar</button></div></div>`;
  m.classList.add('open');
  const close=()=>m.classList.remove('open');
  document.getElementById('cCancel').onclick=close;
  document.getElementById('cYes').onclick=()=>{onYes();close();};
  m.onclick=(e)=>{if(e.target===m)close();};
}
function toast(msg,type){
  const wrap=document.getElementById('toasts');
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.innerHTML=`${type==='error'?ICN.alert:ICN.check}<span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{t.style.transition='all .3s';t.style.opacity='0';t.style.transform='translateX(120%)';setTimeout(()=>t.remove(),300);},2800);
}

/* ---------- CSV ---------- */
function csvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadCSV(name,content){ const blob=new Blob(['﻿'+content],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
function downloadJSON(name,obj){ const blob=new Blob([JSON.stringify(obj)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
function hoyStamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
async function exportarBackup(){
  try { downloadJSON(`jlrepuestos-backup-${hoyStamp()}.json`, DB); toast('Backup descargado','success'); }
  catch(e){ toast('No se pudo generar el backup','error'); }
}
function importarBackup(file){
  const r=new FileReader();
  r.onload=async ()=>{
    let data; try { data=JSON.parse(r.result); } catch(e){ toast('Archivo inválido','error'); return; }
    if(!data || !Array.isArray(data.productos)){ toast('El archivo no parece un backup válido','error'); return; }
    if(!confirm(`Vas a RESTAURAR un backup con ${data.productos.length} productos y ${(data.ventas||[]).length} ventas.\n\nEsto REEMPLAZA todos los datos actuales. ¿Continuar?`)) return;
    DB = normalize(data); invalidarBlob();
    try { await persist(); } catch(e){ toast('Restaurado en memoria pero no se pudo guardar. Revisa espacio.','error'); }
    applyConfig(); setBrandLogo(); renderNav(); go('dashboard');
    toast('Backup restaurado','success');
  };
  r.readAsText(file);
}
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  text=text.replace(/\r/g,'');
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(cell);cell='';} else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';} else cell+=c; }
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}

const sidebar=document.getElementById('sidebar'), scrim=document.getElementById('scrim');
function closeSidebar(){ sidebar.classList.remove('open'); scrim.classList.remove('open'); }
document.getElementById('hamburger').onclick=()=>{ sidebar.classList.toggle('open'); scrim.classList.toggle('open'); };
