function closeGlobal(){ const box=document.getElementById('globalResults'); box.classList.remove('open'); }
function globalSearchRun(qraw){
  const box=document.getElementById('globalResults');
  const q=(qraw||'').toLowerCase().trim();
  if(!q){ closeGlobal(); box.innerHTML=''; return; }
  const prods=buscarProductos(qraw,6);
  const clis=DB.clientes.filter(c=>[c.nombre,c.doc,c.email].some(v=>(v||'').toLowerCase().includes(q))).slice(0,3);
  const cots=DB.cotizaciones.filter(c=>[c.num,c.cliente].some(v=>(v||'').toLowerCase().includes(q))).slice(0,3);
  let html='';
  if(prods.length){ html+='<div class="gr-sec">Productos</div>'+prods.map(p=>`<div class="gr-item" data-gp="${p.id}"><div style="min-width:0"><div class="cell-strong">${p.desc}</div><div class="cell-mono" style="color:var(--ink-3);font-size:11.5px">${p.codigo} · ${p.marca||''}</div></div><div class="cell-strong" style="white-space:nowrap">${money2(p.precio,p.moneda)}</div></div>`).join(''); }
  if(clis.length){ html+='<div class="gr-sec">Clientes</div>'+clis.map(c=>`<div class="gr-item" data-gc="${c.id}"><div><div class="cell-strong">${c.nombre}</div><div class="cell-mono" style="color:var(--ink-3);font-size:11.5px">${c.tipoDoc||''} ${c.doc||''}</div></div></div>`).join(''); }
  if(cots.length){ html+='<div class="gr-sec">Cotizaciones</div>'+cots.map(c=>`<div class="gr-item" data-gq="${c.id}"><div><div class="cell-strong cell-mono">${c.num}</div><div style="color:var(--ink-3);font-size:11.5px">${c.cliente}</div></div><span class="badge badge-gray">${c.moneda}</span></div>`).join(''); }
  if(!html) html='<div style="padding:22px;text-align:center;color:var(--ink-3)">Sin resultados para "'+qraw+'"</div>';
  box.innerHTML=html; box.classList.add('open');
  box.querySelectorAll('[data-gp]').forEach(el=>el.onclick=()=>{ const v=DB.productos.find(x=>x.id===el.dataset.gp); closeGlobal(); document.getElementById('globalSearch').value=''; go('productos'); const pq=document.getElementById('pq'); if(pq&&v){ pq.value=v.codigo; prodFilter.q=v.codigo; prodFilter.page=1; renderProdTable(); } });
  box.querySelectorAll('[data-gc]').forEach(el=>el.onclick=()=>{ const v=DB.clientes.find(x=>x.id===el.dataset.gc); closeGlobal(); document.getElementById('globalSearch').value=''; go('clientes'); const cq=document.getElementById('cq'); if(cq&&v){ cq.value=v.nombre; cliQ=v.nombre; renderCliTable(); } });
  box.querySelectorAll('[data-gq]').forEach(el=>el.onclick=()=>{ const c=DB.cotizaciones.find(x=>x.id===el.dataset.gq); closeGlobal(); document.getElementById('globalSearch').value=''; printCotiz(c); });
}
const _gs=document.getElementById('globalSearch');
_gs.oninput=(e)=>globalSearchRun(e.target.value);
_gs.onfocus=(e)=>{ if(e.target.value) globalSearchRun(e.target.value); };
document.addEventListener('click',(e)=>{ const w=document.getElementById('searchWrap'); if(w && !w.contains(e.target)) closeGlobal(); });
document.addEventListener('keydown',(e)=>{
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(e.key==='/' && tag!=='INPUT' && tag!=='SELECT' && tag!=='TEXTAREA'){ e.preventDefault(); _gs.focus(); }
  if(e.key==='Escape'){ closeGlobal(); const m=document.getElementById('modal'); if(m) m.classList.remove('open'); }
  if(!SESSION) return;
  if(e.key==='F2'){ e.preventDefault(); go('ventas'); setTimeout(()=>{ const nb=document.querySelector('#segV button[data-t="nueva"]'); if(nb) nb.click(); },0); }
  if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S')){ const btn=document.getElementById('emitBtn')||document.getElementById('emitCotiz')||document.getElementById('emitCompra')||document.getElementById('ncGrabar'); if(btn){ e.preventDefault(); if(!btn.disabled) btn.click(); } }
  // Atajos del Registro de Compras (como en el SGAE): F1 Limpiar · F4 OC · F6 Grabar.
  if(currentView==='facturacompra' && compra){
    if(e.key==='F1'){ e.preventDefault(); renderNuevaCompra(); }
    if(e.key==='F4'){ e.preventDefault(); const b=document.getElementById('compraOC'); if(b) b.click(); }
    if(e.key==='F6'){ e.preventDefault(); const b=document.getElementById('emitCompra'); if(b && !b.disabled) b.click(); }
  }
});

/* ================== AUTENTICACIÓN Y ROLES (Fase 2B) ================== */
let SESSION = null;
function esAdmin(){ return !!(SESSION && SESSION.rol==='admin'); }
function usuarioActual(){ return SESSION ? SESSION.usuario : ''; }
function applyRole(){ document.body.classList.toggle('rol-vendedor', !esAdmin()); }
function showLogin(){
  const el=document.getElementById('loginScreen');
  const users=(DB.usuarios||[]).filter(u=>u.activo!==false);
  el.innerHTML=`<div class="login-card">
    <div class="brand-logo" style="width:56px;height:56px;font-size:22px;margin:0 auto 14px">JL</div>
    <h1 style="font-size:22px;font-weight:800;letter-spacing:-.5px">JL Repuestos</h1>
    <p style="color:var(--ink-2);margin:4px 0 22px">Selecciona tu usuario para entrar</p>
    <div class="login-users">${users.map(u=>`<button class="login-user" data-u="${u.id}"><div class="avatar">${(u.nombre||'?').charAt(0)}</div><div style="text-align:left"><div class="cell-strong">${u.nombre}</div><div style="font-size:12px;color:var(--ink-3)">${u.rol==='admin'?'Administrador':'Vendedor'}</div></div></button>`).join('')||'<p style="color:var(--ink-3);margin-bottom:12px">No hay usuarios registrados.</p><button class="btn btn-primary" id="crearAdmin">Crear usuario administrador</button>'}</div>
    <div id="pinArea"></div>
  </div>`;
  el.classList.add('open');
  el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>askPin(b.dataset.u));
  const ca=document.getElementById('crearAdmin');
  if(ca) ca.onclick=()=>{ DB.usuarios=[ {id:'u-admin',nombre:'Angelo',usuario:'admin',pin:'1234',rol:'admin',activo:true}, {id:'u-vend',nombre:'Vendedor',usuario:'vendedor',pin:'0000',rol:'vendedor',activo:true} ]; save().finally(()=>showLogin()); };
}
function askPin(uid){
  const u=(DB.usuarios||[]).find(x=>x.id===uid); if(!u) return;
  const area=document.getElementById('pinArea');
  area.innerHTML=`<div class="pin-box">
    <div class="cell-strong" style="margin-bottom:10px">${u.nombre} — ingresa tu PIN</div>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="10" class="pin-input" placeholder="••••">
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:center"><button class="btn btn-ghost" id="pinBack">Volver</button><button class="btn btn-primary" id="pinOk">Entrar</button></div>
    <div id="pinErr" style="color:var(--red);font-size:12.5px;margin-top:10px;height:16px"></div>
  </div>`;
  const inp=document.getElementById('pinInput'); setTimeout(()=>inp.focus(),30);
  const intento=()=>{ if(String(u.pin)===String(inp.value)){ setSession(u); } else { document.getElementById('pinErr').textContent='PIN incorrecto'; inp.value=''; inp.focus(); } };
  document.getElementById('pinOk').onclick=intento;
  inp.onkeydown=(e)=>{ if(e.key==='Enter') intento(); };
  document.getElementById('pinBack').onclick=()=>{ area.innerHTML=''; };
}
function setSession(u){
  SESSION=u;
  document.getElementById('loginScreen').classList.remove('open');
  applyRole(); renderNav(); renderUserChip(); go('dashboard');
  toast('Bienvenido, '+u.nombre,'success');
}
function logout(){ SESSION=null; showLogin(); }
function renderUserChip(){
  const el=document.getElementById('userChip'); if(!el) return;
  if(!SESSION){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="avatar">${(SESSION.nombre||'?').charAt(0)}</div>
    <div style="flex:1;min-width:0"><div class="user-name">${SESSION.nombre}</div><div class="user-role">${esAdmin()?'Administrador':'Vendedor'}</div></div>
    <button class="icon-btn" id="logoutBtn" title="Cerrar sesión" style="color:#94a3b8;width:32px;height:32px">${ICN.logout}</button>`;
  document.getElementById('logoutBtn').onclick=logout;
}

/* ---------- Boundary global de errores (ningún fallo queda en silencio) ---------- */
window.addEventListener('error', (ev)=>{ console.error('[JLR] Error no controlado:', ev.error||ev.message); });
window.addEventListener('unhandledrejection', (ev)=>{ console.error('[JLR] Promesa rechazada:', ev.reason); });

/* ---------- Init ---------- */
initTheme();
(async function boot(){
  try {
    DB = await load();
  } catch(e){
    // Fallo de LECTURA de la BD local: no sembrar, no pisar datos. Avisar y permitir recargar.
    document.getElementById('view').innerHTML =
      `<div class="card" style="max-width:520px;margin:60px auto;padding:32px;text-align:center">
        <h2 style="color:var(--red);margin-bottom:8px">No se pudo leer la base de datos local</h2>
        <p style="color:var(--ink-2);margin-bottom:20px">Para proteger tus datos, el sistema NO cargó nada por defecto (así no se sobrescribe tu información). Cierra otras pestañas del sistema y vuelve a intentar.</p>
        <button class="btn btn-primary" onclick="location.reload()">Reintentar</button>
      </div>`;
    return;
  }
  // Garantía: si por cualquier razón la BD quedó sin usuarios, recrea los de por defecto
  // (evita quedar bloqueado en el login "No hay usuarios"). NO toca el resto de datos.
  if(!Array.isArray(DB.usuarios) || !DB.usuarios.length){
    DB.usuarios = [
      { id:'u-admin', nombre:'Angelo', usuario:'admin', pin:'1234', rol:'admin', activo:true },
      { id:'u-vend', nombre:'Vendedor', usuario:'vendedor', pin:'0000', rol:'vendedor', activo:true },
    ];
    try { await save(); } catch(e){}
  }
  applyConfig();
  setBrandLogo();
  renderNav();
  showLogin();   // el sistema exige iniciar sesión; setSession() entra al dashboard
})();
</script>
